# SpaV2 "Spa" dashboard (sidebar). Built-in HA cards only.
# This file is the source of truth: create_dashboard.py overwrites the
# dashboard with it, so make changes here, not in the HA editor.
title: Spa
views:
  - title: Spa
    path: spa
    icon: mdi:hot-tub
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Now
            icon: mdi:hot-tub
          - type: tile
            entity: sensor.spa_water_temperature
            name: Water
          - type: tile
            entity: sensor.spa_ph
            name: pH
          - type: tile
            entity: sensor.spa_chlorine
            name: Chlorine
          - type: tile
            entity: sensor.smarterspa_state
            name: Chlorinator
          - type: tile
            entity: sensor.spa_pump_speed
            name: Pump
          - type: tile
            entity: binary_sensor.spa_readings_live
            name: pH/ORP live
          - type: gauge
            entity: sensor.spa_ph
            name: pH
            min: 6.5
            max: 8.5
            needle: true
            grid_options:
              columns: full
            segments:
              - from: 6.5
                color: "#db4437"
              - from: 7.2
                color: "#43a047"
              - from: 7.8
                color: "#db4437"

      - type: grid
        cards:
          - type: heading
            heading: Last 24 hours
            icon: mdi:chart-line
          - type: history-graph
            hours_to_show: 24
            grid_options:
              columns: full
            entities:
              - entity: sensor.spa_ph
              - entity: sensor.spa_orp
          - type: history-graph
            hours_to_show: 24
            grid_options:
              columns: full
            entities:
              - entity: sensor.spa_water_temperature
          - type: history-graph
            hours_to_show: 24
            grid_options:
              columns: full
            entities:
              - entity: binary_sensor.spa_pump_running
                name: Pump
              - entity: binary_sensor.smarterspa_generating
                name: Generating
          - type: entities
            grid_options:
              columns: full
            entities:
              - entity: sensor.spa_orp
                name: ORP
              - entity: sensor.spa_pump_current
                name: Pump current
              - entity: sensor.spa_pump_runtime_24h
                name: Pump runtime (24 h)
              - entity: sensor.smarterspa_generating_24h
                name: Generating (24 h)
              - entity: sensor.spa_electrode_hours
                name: Electrode hours (life ~7,000-10,000 h)

      - type: grid
        cards:
          - type: heading
            heading: Calibration
            icon: mdi:tune-variant
          - type: entities
            state_color: false
            grid_options:
              columns: full
            entities:
              - entity: sensor.spa_calibration_status
                name: Status
              - entity: input_datetime.spa_last_ph_calibration
                name: pH last calibrated
              - entity: input_number.spa_ph_offset
                name: pH offset (added to the probe's pH)
              - entity: input_datetime.spa_last_orp_calibration
                name: ORP last calibrated
              - entity: input_number.spa_orp_offset
                name: ORP offset (added to the probe's ORP)
              - type: section
                label: "Probe in solution, wait ~1 min, then press. pH: 7 first, then 4 (10 optional)."
              - type: button
                name: pH 7 buffer
                icon: mdi:numeric-7-circle
                action_name: Calibrate
                tap_action:
                  action: perform-action
                  perform_action: switch.turn_on
                  target:
                    entity_id: switch.spa_calibrate_ph_7
              - type: button
                name: pH 4 buffer
                icon: mdi:numeric-4-circle
                action_name: Calibrate
                tap_action:
                  action: perform-action
                  perform_action: switch.turn_on
                  target:
                    entity_id: switch.spa_calibrate_ph_4
              - type: button
                name: pH 10 buffer
                icon: mdi:numeric-10-circle
                action_name: Calibrate
                tap_action:
                  action: perform-action
                  perform_action: switch.turn_on
                  target:
                    entity_id: switch.spa_calibrate_ph_10
              - type: button
                name: ORP reference (225 mV)
                icon: mdi:flash-triangle-outline
                action_name: Calibrate
                tap_action:
                  action: perform-action
                  perform_action: switch.turn_on
                  target:
                    entity_id: switch.spa_calibrate_orp
              - type: button
                name: Clear pH + ORP calibration
                icon: mdi:backup-restore
                action_name: Clear
                tap_action:
                  action: perform-action
                  perform_action: switch.turn_on
                  target:
                    entity_id: switch.spa_calibrate_clear
                  confirmation:
                    text: Reset pH and ORP calibration to factory defaults?
          - type: entities
            title: Thresholds (tune against test strips)
            grid_options:
              columns: full
            entities:
              - entity: input_number.spa_orp_low_mv
                name: Chlorine Low below
              - entity: input_number.spa_orp_high_mv
                name: Chlorine High above
              - entity: input_number.spa_ph_low
                name: pH alert below
              - entity: input_number.spa_ph_high
                name: pH alert above
