
# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# Human-readable names for the MiniSplit firmware's raw repurposed Matter
# endpoints (2026-09-01) -- these are the underlying sensors the "MiniSplit
# Last Outage Reason" / "MiniSplit Thread RSSI" template sensors below read
# from and translate; customize: just makes the raw ones legible too,
# instead of Home Assistant's auto-generated "Bedroom Mini Split Ac Bridge
# Humidity 10"-style names, without touching the entity registry directly.
#
# 2026-09-08: retargeted from _8/_9/_10/_11 to _6/_7/_8/_9 (endpoint -> 6/7/8/9)
# after removing the firmware's BME280 endpoints shifted every later Matter
# endpoint down by 2. Also dropped the "deprecated BME280" and "STALE
# DUPLICATE" entries that used to live here -- BME280 support and the old
# duplicate Matter node are both actually gone now (firmware recompiled
# without it; the duplicate node's entities were deleted from the registry
# directly), so there's nothing left for those entries to hide.
homeassistant:
  customize:
    sensor.bedroom_mini_split_ac_bridge_humidity_8:
      friendly_name: "MiniSplit Outage Reason (raw code)"
      icon: mdi:alert-circle-outline
    binary_sensor.bedroom_mini_split_ac_bridge_occupancy_7:
      friendly_name: "MiniSplit Outage Active (raw)"
      icon: mdi:alert
    sensor.bedroom_mini_split_ac_bridge_humidity_9:
      friendly_name: "MiniSplit Thread RSSI (raw)"
      icon: mdi:signal
    # Canonical MiniSplit humidity value as of 2026-09-06 -- the Zigbee
    # "follow me" device (sensor.0x18690afffe5602f1_temperature is its
    # temperature counterpart, already used in automations.yaml) also
    # reports humidity, with no BME280 dependency.
    sensor.0x18690afffe5602f1_humidity:
      friendly_name: "MiniSplit Humidity"
      icon: mdi:water-percent

# 2026-09-06: the BME280 rate-of-change / lag-projection mechanism that used
# to be documented here (sensor.minisplit_bme280_trend, lag_minutes,
# projected_error) has been removed -- BME280 itself was retired for a
# Zigbee "follow me" temp sensor (sensor.0x18690afffe5602f1_temperature),
# and the smoothing/derivative pipeline built specifically to filter
# BME280's supply-airflow noise has nothing left to filter. Both
# setpoint-correction automations now compare the follow-me reading against
# target_temp directly, with no lag projection.
#
# Retires the generic_thermostat + template switch approach that used to be
# here: that only ever toggled hvac_mode (Cool/Off), which is a no-op once
# Tuya is already sitting in Cool mode (as it does in normal use) -- it never
# touched the one thing that actually gates Tuya's own compressor decision
# (its onboard temp_current vs temp_set). The cascade automation replaces it
# by continuously correcting temp_set itself, letting Tuya's own inner
# hysteresis keep doing the fast on/off cycling it already does reasonably
# well.
#
# The cascade automation's target temperature used to be a single
# user-adjustable input_number (minisplit_target_temp), hand-set via a
# slider. Replaced 2026-08-07 by a day/night schedule instead -- see
# sensor.minisplit_computed_setpoint below -- since a single flat target
# doesn't match how the room is actually used (warmer daytime target,
# cooler overnight). minisplit_target_temp itself was removed rather than
# kept alongside the new sensor: with both existing, "which one does the
# cascade automation actually read" becomes a real question every time this
# file is revisited, and there was never a reason to keep an unused,
# identically-purposed input_number lying around once the sensor replaced it.
input_number:
  # minisplit_adaptive_gain / minisplit_last_correction_sign (the cascade
  # automation's gain state) removed 2026-10-05 along with that automation
  # -- see git history.

  # Day/night setpoints that sensor.minisplit_computed_setpoint (below)
  # interpolates between. These are the only MiniSplit values meant to be
  # hand-set now -- the computed setpoint itself is read-only. Split into
  # heat/cool pairs 2026-10-01 (was a single mode-blind pair): the computed
  # setpoint sensor picks a pair based on thermostat_6's current hvac_mode,
  # same as minisplit_mode_cool_band/minisplit_mode_heat_band's existing
  # suffix convention. Same "no initial:" reasoning as the other MiniSplit
  # input_numbers.
  minisplit_day_setpoint_heat:
    name: "MiniSplit Day Temp (Heat)"
    min: 65
    max: 80
    step: 0.5
    unit_of_measurement: "°F"
    icon: mdi:weather-sunny
    mode: slider

  minisplit_night_setpoint_heat:
    name: "MiniSplit Night Temp (Heat)"
    min: 65
    max: 80
    step: 0.5
    unit_of_measurement: "°F"
    icon: mdi:weather-night
    mode: slider

  minisplit_day_setpoint_cool:
    name: "MiniSplit Day Temp (Cool)"
    min: 65
    max: 80
    step: 0.5
    unit_of_measurement: "°F"
    icon: mdi:weather-sunny
    mode: slider

  minisplit_night_setpoint_cool:
    name: "MiniSplit Night Temp (Cool)"
    min: 65
    max: 80
    step: 0.5
    unit_of_measurement: "°F"
    icon: mdi:weather-night
    mode: slider

  # minisplit_temp_offset (calibration constant for BME280 placement bias)
  # removed 2026-09-06: BME280 was retired in favor of a Zigbee "follow me"
  # temp sensor (sensor.0x18690afffe5602f1_temperature) with no comparable
  # placement bias to correct for, so there's nothing left for this to feed.
  # sensor.minisplit_bme280_corrected (below) removed the same day for the
  # same reason.

  # --- State for the "MiniSplit FollowMe predictive setpoint correction"
  # automation (automations.yaml). (Originally kept separate from the
  # cascade automation's own gain state; that automation and its helpers
  # were removed 2026-10-05.)
  #
  # No `initial:` on any of these, same reasoning as the pair above: these
  # need to survive HA restarts as whatever they last adapted to. Since
  # they're brand new (2026-08-26) with nothing to restore yet, each is
  # seeded once via a one-time input_number.set_value / input_datetime.set_datetime
  # call right after this file is first loaded, rather than via `initial:`
  # (which would reset it on every restart instead of just the first).
  minisplit_predictive_adaptive_gain:
    name: "MiniSplit Predictive Adaptive Gain"
    min: 0.3
    max: 1.2
    step: 0.01
    icon: mdi:tune-variant
    mode: box

  minisplit_predictive_last_correction_sign:
    name: "MiniSplit Predictive Last Correction Sign"
    min: -1
    max: 1
    step: 1
    icon: mdi:swap-vertical
    mode: box

  # Sign (-1/0/+1) of the predictive automation's `error` term (followme_now
  # - target_temp) as of the *previous* run, compared against the current
  # sign each run to detect a reversal -- see minisplit_trend_sign_since
  # below, which only resets on a real flip. Feeds two anti-overshoot
  # guards in automations.yaml: a halved max_step_down/up for ~10 minutes
  # after a fresh flip, and a relaxed (1 -> 0.5 degree) min_move threshold
  # once a sign has held unreversed for 40+ minutes.
  #
  # 2026-09-06: until this date the tracked sign was sensor.minisplit_bme280_trend's
  # derivative (rate of change), not error's own sign -- rebuilt on error
  # directly when BME280 (and that derivative sensor) was retired for a
  # Zigbee "follow me" temp sensor, since the underlying "a freshly reversed
  # signal isn't trustworthy yet" protection was never actually specific to
  # BME280's supply-airflow noise; it just needs *some* signal to track
  # persistence of, and error is the one this automation still reads
  # directly. Entity IDs kept as minisplit_trend_last_sign / (below)
  # minisplit_trend_sign_since rather than renamed, so the existing live
  # helper state carries over with no new-helper reseed needed.
  minisplit_trend_last_sign:
    name: "MiniSplit Error Sign (Last)"
    min: -1
    max: 1
    step: 1
    icon: mdi:swap-vertical

  # --- State for the new "MiniSplit Auto Mode Shadow Decision" automation
  # (automations.yaml) -- see PLAN_AUTO_MODE.md. Phase 0, shadow-only: this
  # automation never writes to the real unit. Same "no initial:" reasoning
  # as the pairs above (these need to survive restarts as whatever they last
  # adapted to, not reset to a hardcoded seed) -- seeded once via a one-time
  # input_number.set_value call right after this file is first loaded, same
  # pattern the predictive automation's gain helpers above used.
  minisplit_mode_cool_band:
    name: "MiniSplit Mode Cool Band"
    min: 0.5
    max: 4
    step: 0.1
    unit_of_measurement: "°F"
    icon: mdi:snowflake-thermometer
    mode: box

  minisplit_mode_heat_band:
    name: "MiniSplit Mode Heat Band"
    min: 0.5
    max: 4
    step: 0.1
    unit_of_measurement: "°F"
    icon: mdi:fire
    mode: box

  # Manual override (2026-10-05): the last setpoint the setpoint automation
  # wrote to Desired. Desired changing to anything else -- the HA card, or a
  # remote/app change the firmware adopted -- is a manual override (see
  # "MiniSplit Manual Override Detect" in automations.yaml).
  minisplit_schedule_setpoint:
    name: "MiniSplit Schedule Setpoint"
    min: 50
    max: 90
    step: 0.5
    unit_of_measurement: "°F"
    icon: mdi:calendar-clock
    mode: box

  # minisplit_mode_w_hallway / _w_outdoor (predictor weights) and
  # minisplit_mode_cool_outdoor_min / _heat_outdoor_max (fixed outdoor
  # gates) removed 2026-10-05 with the shadow-rule simplification -- see the
  # Shadow Wanted/Satisfied binary sensors below.

# PLAN_AUTO_MODE.md Phase 0 -- shadow-only mode decision, written by the new
# "MiniSplit Auto Mode Shadow Decision" automation (automations.yaml). Never
# read by anything that controls the real unit. An input_select instead of a
# stateless template sensor specifically because the hysteresis/dwell-floor
# logic that makes "hold for hours" meaningful needs to know the *current*
# decision to decide whether to change it -- a plain template sensor (no
# memory of its own last value) can't provide that.
#
# 2026-10-04: `initial: "off"` removed -- it reasserted itself on every HA
# restart (PLAN_AUTO_MODE.md's open "needs to be understood before Phase 2"
# finding), resetting the decision and its dwell bookkeeping; a 2026-10-04
# restart produced a spurious cool->off this way. Without `initial:` it
# restores its last state like the input_numbers above.
input_select:
  # How the setpoint automation picks Desired (2026-10-05). "direct": Desired
  # = the target, written only when it changes -- the unit regulates on the
  # real room temperature itself as long as Follow-Me is engaged.
  # "predictive": the original offset controller, which exists to
  # compensate for the unit judging the room by its own (3-4F warm) sensor.
  # "direct" automatically falls back to "predictive" while
  # binary_sensor.minisplit_followme_engaged is off. No initial: -- restores
  # across restarts; first boot lands on "direct".
  minisplit_setpoint_strategy:
    name: "MiniSplit Setpoint Strategy"
    options:
      - "direct"
      - "predictive"
    icon: mdi:target

  minisplit_shadow_mode:
    name: "MiniSplit Shadow Mode Decision"
    options:
      - "off"
      - "cool"
      - "heat"
    icon: mdi:thermostat

# Which mode the shadow decision was in before its most recent return to
# Off, so the automation can refuse a direct Cool<->Heat reversal within
# 6 hours (shoulder season: 50F nights, upper-70s afternoons). Empty/unknown
# until the first time it leaves an active mode.
input_text:
  minisplit_shadow_prev_mode:
    name: "MiniSplit Shadow Previous Mode"
    max: 8
    icon: mdi:history

# Read-only, computed setpoint interpolated from the heat or cool day/night
# pair above (picked by thermostat_6's current hvac_mode): flat at the night
# setpoint 22:00-07:00, ramps linearly up to the day setpoint 07:00-11:00,
# flat at the day setpoint 11:00-19:00, ramps back down to the night
# setpoint 19:00-22:00. Read by the "MiniSplit FollowMe cascade setpoint
# correction" and "...predictive setpoint correction" automations
# (automations.yaml) as their target temperature every run.
#
# Deliberately a `template:` sensor, not an input_number -- unlike the
# input_numbers above, this value should never be hand-editable: it's fully
# determined by the day/night setpoints and time of day, and a previous
# input_number + automation-writes-to-it design (retired here) meant a user
# edit would just get silently overwritten within 5 minutes, which read as
# broken rather than intentional. A plain template sensor has no `set`
# service at all, so there's nothing to silently overwrite -- the read-only-
# ness is enforced by the entity type itself, not by convention.
#
# Needs the `trigger:` form (not a plain state/value_template sensor):
# ordinary template sensors only recompute when a *referenced entity's
# state* changes, but nothing here changes on its own as time passes within
# a flat or ramp window (day/night setpoint can sit unchanged for hours) --
# without an explicit time-based trigger, the sensor would only update
# when you actually touch a day/night setpoint slider, not as the ramp
# windows come and go. The time_pattern trigger below re-evaluates it every
# 5 minutes regardless of whether anything else changed.
#
# 2026-10-01: split the single mode-blind day/night pair into heat/cool
# pairs (minisplit_day_setpoint_heat/_cool, _night_ likewise) -- the same
# number was being asked to serve as both "heat is satisfied" and "cool is
# needed," leaving no real deadband between the two, which is also why the
# shadow-mode decision automation's `error` term stayed ambiguous against
# live heat-mode behavior. Added thermostat_6 as a second (state) trigger
# alongside the time_pattern one so a mode flip picks the right pair
# immediately rather than waiting up to 5 minutes -- same "needs an
# explicit trigger or it goes stale" lesson as the time_pattern trigger
# above, just for the mode input instead of the clock. Reads mode via the
# same `hvac_mode_now` pattern the cascade/predictive automations already
# use for their own Follow-Me safety clamp; defaults to the heat pair when
# mode is off/unavailable, matching this sensor's pre-split behavior.
#
# 2026-10-04: the heat and cool targets are now also exposed on their own
# (MiniSplit Heat Target / Cool Target), computed once in `variables:` and
# shared by all three sensors. The shadow-mode decision needs both at once
# -- room vs. cool target to decide on Cool, room vs. heat target to decide
# on Heat -- regardless of which mode the real unit is in; comparing against
# thermostat_6's *current* setpoint (the heat target, while heating) is what
# made it read "room 2F above the heat target" as "needs cooling" and flap
# cool/off every 2 hours. The four day/night sliders are now triggers too,
# so a slider edit takes effect immediately instead of on the next 5-minute
# tick, and homeassistant/start avoids sitting at the restored value after
# a restart.
template:
  - trigger:
      - trigger: time_pattern
        minutes: "/5"
      - trigger: state
        entity_id:
          - climate.bedroom_mini_split_ac_bridge_thermostat_6
          - input_number.minisplit_day_setpoint_heat
          - input_number.minisplit_night_setpoint_heat
          - input_number.minisplit_day_setpoint_cool
          - input_number.minisplit_night_setpoint_cool
      - trigger: homeassistant
        event: start
    variables:
      # Weight of the day setpoint vs. the night one: 0 overnight, ramps up
      # 07:00-11:00, 1 through 19:00, ramps back down by 22:00.
      day_weight: >-
        {% set m = now().hour * 60 + now().minute %}
        {{ 0 if m < 420 else ((m - 420) / 240) if m < 660 else 1 if m < 1140
           else (1 - (m - 1140) / 180) if m < 1320 else 0 }}
      heat_target: >-
        {% set d = states('input_number.minisplit_day_setpoint_heat') | float(69) %}
        {% set n = states('input_number.minisplit_night_setpoint_heat') | float(66) %}
        {{ ((n + day_weight * (d - n)) * 2) | round(0) / 2 }}
      cool_target: >-
        {% set d = states('input_number.minisplit_day_setpoint_cool') | float(74) %}
        {% set n = states('input_number.minisplit_night_setpoint_cool') | float(71) %}
        {{ ((n + day_weight * (d - n)) * 2) | round(0) / 2 }}
    sensor:
      - name: "MiniSplit Target Temp"
        unique_id: minisplit_computed_setpoint
        unit_of_measurement: "°F"
        icon: mdi:thermostat-auto
        state: >-
          {{ cool_target if states('climate.bedroom_mini_split_ac_bridge_thermostat_6') == 'cool' else heat_target }}
      - name: "MiniSplit Heat Target"
        unique_id: minisplit_heat_target
        unit_of_measurement: "°F"
        icon: mdi:fire
        state: "{{ heat_target }}"
      - name: "MiniSplit Cool Target"
        unique_id: minisplit_cool_target
        unit_of_measurement: "°F"
        icon: mdi:snowflake
        state: "{{ cool_target }}"

  # The shadow-mode decision's "is this mode warranted / is it done"
  # conditions. The automation (automations.yaml) only reads these four plus
  # its own dwell/reversal bookkeeping.
  #
  # Room only (2026-10-05, evening):
  #   Cool wanted: room > cool target + band, held 2 hours.
  #   Heat wanted: room < heat target - band, held 2 hours.
  #   Cool done:   room <= cool target - 1, held 30 min.
  #   Heat done:   room >= heat target + 1, held 30 min.
  # "Don't act if doing nothing would also work" is the 2-hour hold: a warm
  # spell that resolves on its own never reaches it. Weather/house gates were
  # tried and dropped the same day -- replay 2026-09-30..10-05:
  #   - outdoor > target (cool) blocked cooling a 73F room on 55-62F evenings
  #     when the house holds the day's heat;
  #   - outdoor OR hallway gave identical decisions to no gate at all (the
  #     hallway tracks the bedroom);
  #   - a trend projection ("back to target within N h at the current rate")
  #     changed no decision at any setting tried: past the band, the room
  #     drifts only ~0.1-0.6F/h on its own. sensor.minisplit_room_trend is on
  #     the dashboard to revisit this with summer data.
  # "Done" is deliberately 1F PAST the target, not at it: with the unit
  # running, the room sitting at target means the mode is doing its job.
  - binary_sensor:
      # Whether the unit is actually using Follow-Me (2026-10-05): with it
      # engaged, the unit reports the relayed Follow-Me value as its own
      # indoor temp (verified by injection 2026-10-05 -- see
      # IR_PROTOCOL_REFERENCE.md); disengaged, it reports its onboard sensor,
      # ~3-4F warm. 2F tolerance covers the whole-C rounding; off only
      # after 30 min of disagreement so a brief lapse doesn't flip the
      # setpoint strategy.
      - name: "MiniSplit Follow-Me Engaged"
        unique_id: minisplit_followme_engaged
        icon: mdi:thermometer-check
        delay_off: "00:30:00"
        availability: >-
          {{ has_value('sensor.0x18690afffe5602f1_temperature')
             and state_attr('climate.mini_split_ac_bridge_thermostat_1', 'current_temperature') is not none }}
        state: >-
          {{ ((state_attr('climate.mini_split_ac_bridge_thermostat_1', 'current_temperature') | float(0))
              - (states('sensor.0x18690afffe5602f1_temperature') | float(0))) | abs <= 2 }}
      # On while a manual setpoint (HA card or remote) is holding off the
      # setpoint automation -- see input_datetime.minisplit_override_until.
      - name: "MiniSplit Manual Override"
        unique_id: minisplit_manual_override
        icon: mdi:hand-back-right
        state: >-
          {% set u = states('input_datetime.minisplit_override_until') %}
          {{ u not in ['unknown', 'unavailable', ''] and now().timestamp() < as_timestamp(u, 0) }}
      - name: "MiniSplit Shadow Cool Wanted"
        unique_id: minisplit_shadow_cool_wanted
        icon: mdi:snowflake-alert
        delay_on: "02:00:00"
        availability: >-
          {{ has_value('sensor.0x18690afffe5602f1_temperature') and has_value('sensor.minisplit_cool_target') }}
        state: >-
          {{ states('sensor.0x18690afffe5602f1_temperature') | float(0)
             > states('sensor.minisplit_cool_target') | float(0) + states('input_number.minisplit_mode_cool_band') | float(1.5) }}
      - name: "MiniSplit Shadow Heat Wanted"
        unique_id: minisplit_shadow_heat_wanted
        icon: mdi:fire-alert
        delay_on: "02:00:00"
        availability: >-
          {{ has_value('sensor.0x18690afffe5602f1_temperature') and has_value('sensor.minisplit_heat_target') }}
        state: >-
          {{ states('sensor.0x18690afffe5602f1_temperature') | float(0)
             < states('sensor.minisplit_heat_target') | float(0) - states('input_number.minisplit_mode_heat_band') | float(1.5) }}
      - name: "MiniSplit Shadow Cool Satisfied"
        unique_id: minisplit_shadow_cool_satisfied
        icon: mdi:snowflake-check
        delay_on: "00:30:00"
        availability: >-
          {{ has_value('sensor.0x18690afffe5602f1_temperature') and has_value('sensor.minisplit_cool_target') }}
        state: >-
          {{ states('sensor.0x18690afffe5602f1_temperature') | float(0) <= states('sensor.minisplit_cool_target') | float(0) - 1 }}
      - name: "MiniSplit Shadow Heat Satisfied"
        unique_id: minisplit_shadow_heat_satisfied
        icon: mdi:fire-off
        delay_on: "00:30:00"
        availability: >-
          {{ has_value('sensor.0x18690afffe5602f1_temperature') and has_value('sensor.minisplit_heat_target') }}
        state: >-
          {{ states('sensor.0x18690afffe5602f1_temperature') | float(0) >= states('sensor.minisplit_heat_target') | float(0) + 1 }}

  # sensor.minisplit_bme280_corrected removed 2026-09-06: BME280 (and its
  # smoothing sensor, sensor.minisplit_bme280_smoothed) retired in favor of
  # a Zigbee "follow me" temp sensor (sensor.0x18690afffe5602f1_temperature)
  # with no placement bias to correct for and no need for the offset/
  # smoothing this sensor applied. automations.yaml now reads the follow-me
  # entity directly.

  # Combined outage status for the MiniSplit firmware's "Outage Active"
  # (occupancy_7) and "Outage Reason" (humidity_8) endpoints
  # (outage_log.h / matter_device.cpp, 2026-09-01). Reason is a code
  # (0=none, 1=Tuya unreachable, 2=Setpoint mismatch, 3=Device restart,
  # 4=Thread disconnected), not a percentage -- humidity_8 is a repurposed
  # Humidity Sensor endpoint. Reason 4 can only ever show up here *after
  # the fact*, once Thread reattaches -- see outage_log.h's doc comment for
  # why that one can't be reported live.
  #
  # Originally two separate sensors (an "Outage Active" binary_sensor and a
  # "Last Outage Reason" text sensor, which kept showing the last reason
  # even once resolved). Combined 2026-09-01 so one entity answers "is
  # something wrong, and what" at a glance -- state is "Clear" whenever
  # occupancy_7 is off, otherwise the decoded reason string. The full
  # open/close timeline is still free from this entity's own history/
  # logbook, same as the old binary sensor gave.
  #
  # Confirmed live (2026-09-01): humidity_8 appeared automatically after
  # restarting the matter-server container (no full re-pairing or manual
  # re-interview needed) as endpoint 10, picking up the device's
  # "bedroom_" name prefix like the other more-recently-added endpoints
  # (7, 8).
  - trigger:
      - trigger: state
        entity_id:
          - binary_sensor.bedroom_mini_split_ac_bridge_occupancy_7
          - sensor.bedroom_mini_split_ac_bridge_humidity_8
      - trigger: homeassistant
        event: start
    sensor:
      - name: "MiniSplit Outage Status"
        unique_id: minisplit_outage_status
        icon: mdi:alert-circle-outline
        state: >-
          {% if not is_state('binary_sensor.bedroom_mini_split_ac_bridge_occupancy_7', 'on') %}
            Clear
          {% else %}
            {% set code = states('sensor.bedroom_mini_split_ac_bridge_humidity_8') | int(0) %}
            {{ {0: "none", 1: "Tuya unreachable", 2: "Setpoint mismatch",
                3: "Device restart", 4: "Thread disconnected"}.get(code, "unknown") }}
          {% endif %}

  # Friendly relabel + decode for the MiniSplit firmware's Thread parent RSSI
  # endpoint (matter_device.cpp's matter_update_thread_rssi(), 2026-09-01).
  # Originally a repurposed Temperature Sensor endpoint -- confirmed live
  # that was the wrong choice: Home Assistant applies a real C->F conversion
  # to those (127 "°C" rendered as 260.6 "°F"), corrupting the raw dBm
  # value. Switched to a Humidity Sensor endpoint (no unit conversion
  # applied), encoded firmware-side as (rssi_dbm + 128) * 100 since that
  # cluster's value is unsigned. Home Assistant's own /100 division already
  # happens on the Matter side, so this template only needs to undo the
  # +128 offset. 255 decodes from OpenThread's own OT_RADIO_RSSI_INVALID
  # sentinel (127 + 128) -- shown as unknown rather than a fake -1 dBm.
  #
  # 2026-09-09: found this sensor had been stuck on "unknown" since at least
  # 2026-09-03 (confirmed via repeated "Received invalid sensor state:
  # unknown for entity sensor.minisplit_thread_rssi, expected a number"
  # errors in the HA log, spanning 9/3-9/7, well before today's endpoint
  # retargeting) -- unrelated to the endpoint shift, a real pre-existing
  # bug. Root cause: this sensor declares unit_of_measurement, so Home
  # Assistant validates its rendered state as numeric; the old template's
  # `{% else %} unknown {% endif %}` branch produced the literal three-
  # letter STRING "unknown" as a candidate state, which fails that numeric
  # check and gets rejected outright (logged, then the entity is left
  # however it was, which was however this exact failure had already left
  # it -- self-reinforcing once it happens once). Fixed by rendering Jinja's
  # `none` for the invalid case instead of literal text -- that's the
  # actually-blessed way to make a numeric template sensor report unknown,
  # since Home Assistant special-cases a fully-None render rather than
  # trying to parse it as a number.
  - trigger:
      - trigger: state
        entity_id: sensor.bedroom_mini_split_ac_bridge_humidity_9
    sensor:
      - name: "MiniSplit Thread RSSI"
        unique_id: minisplit_thread_rssi
        unit_of_measurement: "dBm"
        icon: mdi:signal
        state: >-
          {% set raw = states('sensor.bedroom_mini_split_ac_bridge_humidity_9') %}
          {% set v = raw | float(-1) | round(0) | int %}
          {{ (v - 128) if (v >= 0 and v != 255) else none }}

  # Compressor duty-cycle estimate feeding the predictive automation's gain
  # (automations.yaml, "MiniSplit FollowMe predictive setpoint correction") --
  # added 2026-09-03 after finding the loop reversing the setpoint on almost
  #
  # 2026-09-08: the trigger/state entity_id below was
  # "binary_sensor.mini_split_ac_bridge_occupancy" with no number -- that
  # entity has never existed (missing the endpoint suffix entirely, a typo
  # from whenever this was written), so this sensor was silently running on
  # the /10-minute timer fallback alone the whole time, never actually
  # decaying toward a fresh compressor-state change until the next tick.
  # Fixed to point at the real Compressor Running entity (also retargeted
  # from endpoint 6 to 4 by the same BME280-removal endpoint shift as
  # everything else on this page).
  # every 10-minute tick during low-load stretches (idle overnight, a mild
  # afternoon) even after the same day's BME280 smoothing/derivative
  # widening: the corrected sensor still swings +-1F within a single
  # 20-30min stretch at idle (BME280 sits in the unit's own supply
  # airflow), and with nothing tracking how much the compressor has
  # actually been running lately, the loop treated that swing exactly like
  # a real room trend and reversed direction to match it every time.
  #
  # An exponential moving average of instantaneous compressor state (1=on,
  # 0=off), not a fixed rolling window -- simulated both against real
  # 9/2-9/3 history before choosing: a fixed window has a hard edge, so a
  # single cycle aging out of it can jump the estimate sharply (one real
  # case: 0% -> 2.9% -> 34.7% across two 10-minute ticks as a cycle entered
  # a 30-minute window). EWMA decays continuously instead, so the same
  # event moves the estimate more gradually (7.8% -> 25.8% in the
  # equivalent case) with no cliff as history ages out. At an equivalent
  # time constant, EWMA halved the write/reversal counts a same-length
  # fixed window got on the same replay (half-life 15-20min: 8 writes / 2
  # reversals over the 9/2 21:00 - 9/3 17:00 replay, vs 14/6 for a 3-hour
  # fixed window) and fully eliminated reversals in the afternoon window
  # that prompted this change.
  #
  # tau = half_life / ln(2); 20-minute half-life -> tau ~= 1731s. Self-
  # referencing (reads its own last state and last_updated), so it needs
  # the trigger form -- decays toward the current compressor state on every
  # occupancy change AND on a 10-minute timer, so it keeps decaying even
  # through a long stretch with no on/off transition at all (matching the
  # cadence the predictive automation reads it at). First run has no prior
  # state, so `ent is not none` guards a clean bootstrap: dt collapses to 0
  # and the sensor starts at 0% (assume no load until proven otherwise)
  # rather than erroring on a nonexistent previous state.
  - trigger:
      - trigger: state
        entity_id: binary_sensor.bedroom_mini_split_ac_bridge_occupancy_4
      - trigger: time_pattern
        minutes: "/10"
      # Without this, the sensor sits at "unknown" after every HA restart
      # until the next occupancy change or /10 tick -- confirmed live
      # 2026-09-03 right after the first deploy (predictive automation
      # still worked, since `| float(0)` degrades load_factor to its 0.15
      # floor rather than erroring, but there's no reason to wait when
      # "MiniSplit Outage Status" above already established this pattern
      # for the same problem).
      - trigger: homeassistant
        event: start
    sensor:
      # Named (not just unique_id'd) so the friendly-name slug lands on
      # sensor.minisplit_duty_cycle_ewma -- `object_id:` isn't a valid key
      # for trigger-based template sensors in this HA version (caught by
      # `check_config` before deploy), so entity_id has to come from the
      # name slug matching what this sensor's own self-reference and
      # automations.yaml's gain formula both expect.
      - name: "MiniSplit Duty Cycle EWMA"
        unique_id: minisplit_duty_cycle_ewma
        unit_of_measurement: "%"
        icon: mdi:sine-wave
        state: >-
          {% set tau = 1731 %}
          {% set ent = states.sensor.minisplit_duty_cycle_ewma %}
          {% set prev = (ent.state | float(0) / 100) if (ent is not none and ent.state not in ['unknown', 'unavailable']) else 0 %}
          {% set last_ts = as_timestamp(ent.last_updated) if ent is not none else as_timestamp(now()) %}
          {% set dt = as_timestamp(now()) - last_ts %}
          {% set instant = 1 if is_state('binary_sensor.bedroom_mini_split_ac_bridge_occupancy_4', 'on') else 0 %}
          {% set decayed = instant + (prev - instant) * (2.718281828459045 ** (-dt / tau)) %}
          {{ (decayed * 100) | round(2) }}

  # PLAN_AUTO_MODE.md predictive layer -- passthrough of the AC unit's own
  # outdoor sensor (sensor.mini_split_ac_bridge_outdoor_temperature,
  # Tuya-reported) as the outdoor-temperature input for the mode-decision
  # automation and its trend sensors below.
  #
  # 2026-09-10: was weather.forecast_home's `temperature` attribute (Met.no
  # regional forecast) until found to disagree with this unit's own sensor
  # by 11.6F at the same moment (60F forecast vs 71.6F local, ~10:02am) --
  # too large to be normal sensor noise, and the AC's own sensor is
  # physically at the house, not a regional grid estimate. Switched per
  # direct instruction. Kept as its own passthrough entity (rather than
  # pointing the derivative sensors/automation directly at the AC's sensor)
  # so a future source change stays contained to this one definition.
  #
  # Confirmed live 2026-09-09 (with the old weather.forecast_home source,
  # same underlying pattern applies here): without the homeassistant/start
  # trigger, this sat at "unknown" through a full restart until the source
  # entity's next state change -- same gotcha "MiniSplit Outage Status" and
  # "MiniSplit Duty Cycle EWMA" above already had to add this same trigger for.
  - trigger:
      - trigger: state
        entity_id:
          - sensor.roof_weather_device_temperature
          - sensor.mini_split_ac_bridge_outdoor_temperature
      - trigger: homeassistant
        event: start
      - trigger: event
        event_type: event_template_reloaded
    sensor:
      - name: "MiniSplit Outdoor Temp"
        unique_id: minisplit_outdoor_temp
        unit_of_measurement: "°F"
        icon: mdi:thermometer
        # Roof weather station (SmartThings, added 2026-10-05) -- more accurate
        # than the unit's own outdoor reading; falls back to that when the
        # station is unavailable.
        state: >-
          {% if has_value('sensor.roof_weather_device_temperature') %}
            {{ states('sensor.roof_weather_device_temperature') }}
          {% else %}
            {{ states('sensor.mini_split_ac_bridge_outdoor_temperature') }}
          {% endif %}
        attributes:
          source: >-
            {{ 'weather station' if has_value('sensor.roof_weather_device_temperature') else 'mini-split unit' }}

  # PLAN_AUTO_MODE.md Phase 0 -- records *why* the shadow decision
  # automation (below) did what it did, at the moment it did it. Needed
  # because the raw trend values feeding a decision aren't otherwise
  # persisted anywhere, and reconstructing "what would the trend have read"
  # after the fact isn't reliable once recorder history ages out. Purely
  # derived/stateless (recomputes fresh from current entity states) --
  # unlike the shadow decision itself, this doesn't need memory of its own
  # past value, since it's not the thing enforcing hysteresis.
  #
  # 2026-10-04: rebuilt alongside the shadow decision's rework -- logs room
  # vs. each mode's own target (not vs. thermostat_6's current setpoint),
  # the outdoor gates, and the four 30-minute-held Wanted/Satisfied binary
  # sensors the automation actually acts on. The old reactive_zone/
  # predicted_zone/compressor_idle mirror is gone because the automation no
  # longer uses that logic. inputs_ok's "say stale, don't fabricate"
  # reasoning (2026-09-10, after a thermostat_6 outage logged ~+70F errors)
  # still applies.
  - trigger:
      - trigger: state
        entity_id:
          - sensor.0x18690afffe5602f1_temperature
          - sensor.minisplit_heat_target
          - sensor.minisplit_cool_target
          - sensor.minisplit_outdoor_temp
          - binary_sensor.minisplit_shadow_cool_wanted
          - binary_sensor.minisplit_shadow_heat_wanted
          - binary_sensor.minisplit_shadow_cool_satisfied
          - binary_sensor.minisplit_shadow_heat_satisfied
          - input_select.minisplit_shadow_mode
      - trigger: homeassistant
        event: start
    variables:
      inputs_ok: >-
        {{ has_value('sensor.0x18690afffe5602f1_temperature') and has_value('sensor.minisplit_heat_target')
           and has_value('sensor.minisplit_cool_target') and has_value('sensor.minisplit_outdoor_temp') }}
      room: "{{ states('sensor.0x18690afffe5602f1_temperature') | float(0) }}"
      heat_target: "{{ states('sensor.minisplit_heat_target') | float(0) }}"
      cool_target: "{{ states('sensor.minisplit_cool_target') | float(0) }}"
    sensor:
      - name: "MiniSplit Auto Mode Decision Inputs"
        unique_id: minisplit_auto_mode_decision_inputs
        state: "{{ 'ok' if inputs_ok else 'stale' }}"
        attributes:
          room: "{{ room if inputs_ok else none }}"
          heat_target: "{{ heat_target if inputs_ok else none }}"
          cool_target: "{{ cool_target if inputs_ok else none }}"
          above_cool_target: "{{ (room - cool_target) | round(2) if inputs_ok else none }}"
          below_heat_target: "{{ (heat_target - room) | round(2) if inputs_ok else none }}"
          outdoor: "{{ states('sensor.minisplit_outdoor_temp') }}"
          cool_wanted: "{{ states('binary_sensor.minisplit_shadow_cool_wanted') }}"
          heat_wanted: "{{ states('binary_sensor.minisplit_shadow_heat_wanted') }}"
          cool_satisfied: "{{ states('binary_sensor.minisplit_shadow_cool_satisfied') }}"
          heat_satisfied: "{{ states('binary_sensor.minisplit_shadow_heat_satisfied') }}"
          shadow_mode: "{{ states('input_select.minisplit_shadow_mode') }}"

# Timestamp state for the predictive automation's persistent-sign tracking
# (see input_number.minisplit_trend_last_sign above -- 2026-09-06: now
# tracks error-sign persistence, not BME280 trend, entity ID kept for
# continuity). Starts unset ("unknown") until the automation's first run,
# which the relevant template treats as "just started now" rather than
# erroring or computing a nonsense duration.
input_datetime:
  minisplit_trend_sign_since:
    name: "MiniSplit Error Sign Since"
    has_date: true
    has_time: true

  # Companion to input_select.minisplit_shadow_mode above -- when the shadow
  # decision last actually changed, so the shadow automation can enforce the
  # same hour-scale dwell floor the real automation will eventually need
  # (PLAN_AUTO_MODE.md). Starts unset ("unknown") until the automation's
  # first run, same pattern as minisplit_trend_sign_since above.
  minisplit_shadow_last_change:
    name: "MiniSplit Shadow Mode Last Change"
    has_date: true
    has_time: true

  # When the predictive setpoint automation last wrote the Desired
  # setpoint -- its 29-minute cooldown (2026-10-05). It used to key off
  # thermostat_6's last_updated, which HA restarts, manual edits, mode
  # changes, and the firmware's mode sync all bump too. Unset ("unknown")
  # until the first write, which the cooldown treats as elapsed.
  minisplit_predictive_last_write:
    name: "MiniSplit Predictive Last Write"
    has_date: true
    has_time: true

  # Manual override end (2026-10-05): the setpoint automation leaves Desired
  # alone until then. Set to the next day/night change (07:00 or 19:00) when
  # a manual change is detected; set to now by a mode change or Resume.
  minisplit_override_until:
    name: "MiniSplit Override Until"
    has_date: true
    has_time: true

input_button:
  minisplit_resume_schedule:
    name: "MiniSplit Resume Schedule"
    icon: mdi:calendar-sync

# sensor.minisplit_bme280_smoothed (filter platform) and
# sensor.minisplit_bme280_trend (derivative platform) removed 2026-09-06:
# both existed solely to filter BME280's own supply-airflow noise before
# feeding it into the setpoint-correction automations' trend/projected-error
# math. BME280 has been retired for a Zigbee "follow me" temp sensor
# (sensor.0x18690afffe5602f1_temperature), which automations.yaml now reads
# directly with no smoothing or derivative -- see automations.yaml for the
# corresponding removal of lag_minutes/trend_per_hour/projected_error.

# sensor.minisplit_hallway_trend / _outdoor_trend / _outdoor_trend_3h
# (derivative platform) removed 2026-10-05 -- they only fed the shadow
# decision's early-trigger and 3h-trend gate, both dropped in the
# simplification (see the Shadow Wanted/Satisfied binary sensors above).

# Room temperature trend, F/hour over the last hour (2026-10-05). Display
# only -- nothing decides on it (see the shadow-mode comment in template:
# for why). On the MiniSplit dashboard to see whether summer afternoon
# spikes come and go on their own.
sensor:
  - platform: derivative
    source: sensor.0x18690afffe5602f1_temperature
    name: "MiniSplit Room Trend"
    unique_id: minisplit_room_trend
    unit_time: h
    time_window: "01:00:00"
    round: 1
