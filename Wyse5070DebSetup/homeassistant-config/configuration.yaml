
# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# Human-readable names for the MiniSplit firmware's raw repurposed Matter
# endpoints (2026-09-01) -- these are the underlying sensors the "MiniSplit
# Last Outage Reason" / "MiniSplit Thread RSSI" template sensors below read
# from and translate; customize: just makes the raw ones legible too,
# instead of Home Assistant's auto-generated "Bedroom Mini Split Ac Bridge
# Humidity 10"-style names, without touching the entity registry directly.
#
# 2026-09-08: retargeted from _8/_9/_10/_11 to _6/_7/_8/_9 (endpoint -> 6/7/8/9)
# after removing the firmware's BME280 endpoints shifted every later Matter
# endpoint down by 2. Also dropped the "deprecated BME280" and "STALE
# DUPLICATE" entries that used to live here -- BME280 support and the old
# duplicate Matter node are both actually gone now (firmware recompiled
# without it; the duplicate node's entities were deleted from the registry
# directly), so there's nothing left for those entries to hide.
homeassistant:
  customize:
    sensor.bedroom_mini_split_ac_bridge_humidity_8:
      friendly_name: "MiniSplit Outage Reason (raw code)"
      icon: mdi:alert-circle-outline
    binary_sensor.bedroom_mini_split_ac_bridge_occupancy_7:
      friendly_name: "MiniSplit Outage Active (raw)"
      icon: mdi:alert
    sensor.bedroom_mini_split_ac_bridge_humidity_9:
      friendly_name: "MiniSplit Thread RSSI (raw)"
      icon: mdi:signal
    # Canonical MiniSplit humidity value as of 2026-09-06 -- the Zigbee
    # "follow me" device (sensor.0x18690afffe5602f1_temperature is its
    # temperature counterpart, already used in automations.yaml) also
    # reports humidity, with no BME280 dependency.
    sensor.0x18690afffe5602f1_humidity:
      friendly_name: "MiniSplit Humidity"
      icon: mdi:water-percent

# 2026-09-06: the BME280 rate-of-change / lag-projection mechanism that used
# to be documented here (sensor.minisplit_bme280_trend, lag_minutes,
# projected_error) has been removed -- BME280 itself was retired for a
# Zigbee "follow me" temp sensor (sensor.0x18690afffe5602f1_temperature),
# and the smoothing/derivative pipeline built specifically to filter
# BME280's supply-airflow noise has nothing left to filter. Both
# setpoint-correction automations now compare the follow-me reading against
# target_temp directly, with no lag projection.
#
# Retires the generic_thermostat + template switch approach that used to be
# here: that only ever toggled hvac_mode (Cool/Off), which is a no-op once
# Tuya is already sitting in Cool mode (as it does in normal use) -- it never
# touched the one thing that actually gates Tuya's own compressor decision
# (its onboard temp_current vs temp_set). The cascade automation replaces it
# by continuously correcting temp_set itself, letting Tuya's own inner
# hysteresis keep doing the fast on/off cycling it already does reasonably
# well.
#
# The cascade automation's target temperature used to be a single
# user-adjustable input_number (minisplit_target_temp), hand-set via a
# slider. Replaced 2026-08-07 by a day/night schedule instead -- see
# sensor.minisplit_computed_setpoint below -- since a single flat target
# doesn't match how the room is actually used (warmer daytime target,
# cooler overnight). minisplit_target_temp itself was removed rather than
# kept alongside the new sensor: with both existing, "which one does the
# cascade automation actually read" becomes a real question every time this
# file is revisited, and there was never a reason to keep an unused,
# identically-purposed input_number lying around once the sensor replaced it.
input_number:
  # Adaptive gain state for the cascade automation (automations.yaml): the
  # multiplier itself, and the direction (+1/-1) of the last correction it
  # actually wrote, so the next run can tell whether it's oscillating (this
  # cycle's direction flips the last one -> cut gain 15%) or trending
  # consistently (same direction twice -> ease gain back up 5%). Same
  # "no initial:" reasoning as minisplit_target_temp above -- these need to
  # survive HA restarts, not reset to a hardcoded starting point every time.
  minisplit_adaptive_gain:
    name: "MiniSplit Adaptive Gain"
    min: 0.3
    max: 1.2
    step: 0.01
    icon: mdi:tune-variant
    mode: box

  minisplit_last_correction_sign:
    name: "MiniSplit Last Correction Sign"
    min: -1
    max: 1
    step: 1
    icon: mdi:swap-vertical
    mode: box

  # Day/night setpoints that sensor.minisplit_computed_setpoint (below)
  # interpolates between. These two are the only MiniSplit values meant to
  # be hand-set now -- the computed setpoint itself is read-only.
  # Same "no initial:" reasoning as the other MiniSplit input_numbers.
  minisplit_day_setpoint:
    name: "MiniSplit Day Temp"
    min: 65
    max: 80
    step: 0.5
    unit_of_measurement: "°F"
    icon: mdi:weather-sunny
    mode: slider

  minisplit_night_setpoint:
    name: "MiniSplit Night Temp"
    min: 65
    max: 80
    step: 0.5
    unit_of_measurement: "°F"
    icon: mdi:weather-night
    mode: slider

  # minisplit_temp_offset (calibration constant for BME280 placement bias)
  # removed 2026-09-06: BME280 was retired in favor of a Zigbee "follow me"
  # temp sensor (sensor.0x18690afffe5602f1_temperature) with no comparable
  # placement bias to correct for, so there's nothing left for this to feed.
  # sensor.minisplit_bme280_corrected (below) removed the same day for the
  # same reason.

  # --- State for the "MiniSplit FollowMe predictive setpoint correction"
  # automation (automations.yaml). Kept entirely separate from the
  # minisplit_adaptive_gain / minisplit_last_correction_sign pair above
  # (used by the older cascade automation) so the two controllers -- which
  # may be enabled one at a time while comparing them -- never share
  # learned state. Only ever one of the two automations should be enabled
  # at a time; both write to climate.mini_split_ac_bridge's setpoint and
  # will fight each other otherwise.
  #
  # No `initial:` on any of these, same reasoning as the pair above: these
  # need to survive HA restarts as whatever they last adapted to. Since
  # they're brand new (2026-08-26) with nothing to restore yet, each is
  # seeded once via a one-time input_number.set_value / input_datetime.set_datetime
  # call right after this file is first loaded, rather than via `initial:`
  # (which would reset it on every restart instead of just the first).
  minisplit_predictive_adaptive_gain:
    name: "MiniSplit Predictive Adaptive Gain"
    min: 0.3
    max: 1.2
    step: 0.01
    icon: mdi:tune-variant
    mode: box

  minisplit_predictive_last_correction_sign:
    name: "MiniSplit Predictive Last Correction Sign"
    min: -1
    max: 1
    step: 1
    icon: mdi:swap-vertical
    mode: box

  # Sign (-1/0/+1) of the predictive automation's `error` term (followme_now
  # - target_temp) as of the *previous* run, compared against the current
  # sign each run to detect a reversal -- see minisplit_trend_sign_since
  # below, which only resets on a real flip. Feeds two anti-overshoot
  # guards in automations.yaml: a halved max_step_down/up for ~10 minutes
  # after a fresh flip, and a relaxed (1 -> 0.5 degree) min_move threshold
  # once a sign has held unreversed for 40+ minutes.
  #
  # 2026-09-06: until this date the tracked sign was sensor.minisplit_bme280_trend's
  # derivative (rate of change), not error's own sign -- rebuilt on error
  # directly when BME280 (and that derivative sensor) was retired for a
  # Zigbee "follow me" temp sensor, since the underlying "a freshly reversed
  # signal isn't trustworthy yet" protection was never actually specific to
  # BME280's supply-airflow noise; it just needs *some* signal to track
  # persistence of, and error is the one this automation still reads
  # directly. Entity IDs kept as minisplit_trend_last_sign / (below)
  # minisplit_trend_sign_since rather than renamed, so the existing live
  # helper state carries over with no new-helper reseed needed.
  minisplit_trend_last_sign:
    name: "MiniSplit Error Sign (Last)"
    min: -1
    max: 1
    step: 1
    icon: mdi:swap-vertical

# Read-only, computed setpoint interpolated from minisplit_day_setpoint and
# minisplit_night_setpoint above: flat at the night setpoint 22:00-07:00,
# ramps linearly up to the day setpoint 07:00-11:00, flat at the day
# setpoint 11:00-19:00, ramps back down to the night setpoint 19:00-22:00.
# Read by the "MiniSplit FollowMe cascade setpoint correction" automation
# (automations.yaml) as its target temperature every 10-minute run.
#
# Deliberately a `template:` sensor, not an input_number -- unlike the
# input_numbers above, this value should never be hand-editable: it's fully
# determined by the day/night setpoints and time of day, and a previous
# input_number + automation-writes-to-it design (retired here) meant a user
# edit would just get silently overwritten within 5 minutes, which read as
# broken rather than intentional. A plain template sensor has no `set`
# service at all, so there's nothing to silently overwrite -- the read-only-
# ness is enforced by the entity type itself, not by convention.
#
# Needs the `trigger:` form (not a plain state/value_template sensor):
# ordinary template sensors only recompute when a *referenced entity's
# state* changes, but nothing here changes on its own as time passes within
# a flat or ramp window (day/night setpoint can sit unchanged for hours) --
# without an explicit time-based trigger, the sensor would only update
# when you actually touch a day/night setpoint slider, not as the ramp
# windows come and go. The time_pattern trigger below re-evaluates it every
# 5 minutes regardless of whether anything else changed.
template:
  - trigger:
      - trigger: time_pattern
        minutes: "/5"
    sensor:
      - name: "MiniSplit Target Temp"
        unique_id: minisplit_computed_setpoint
        unit_of_measurement: "°F"
        icon: mdi:thermostat-auto
        state: >-
          {# 2026-09-06: the offset-cancellation note that used to live here is now
             moot -- input_number.minisplit_temp_offset and sensor.minisplit_bme280_corrected
             are both gone (BME280 retired for a Zigbee "follow me" sensor with no
             placement bias to correct for), so there's no offset on either side of the
             cascade/predictive automations' `followme_now - target_temp` comparison to
             cancel. Day/night setpoints also dropped 5F this same day (75/75 -> 70/70
             live), hence the lowered fallback defaults below. #}
          {% set day_setpoint = states('input_number.minisplit_day_setpoint') | float(69) %}
          {% set night_setpoint = states('input_number.minisplit_night_setpoint') | float(63) %}
          {% set now_minutes = now().hour * 60 + now().minute %}
          {% set ramp_up_start = 420 %}
          {% set ramp_up_end = 660 %}
          {% set ramp_down_start = 1140 %}
          {% set ramp_down_end = 1320 %}
          {% set frac_up = min(max((now_minutes - ramp_up_start) / (ramp_up_end - ramp_up_start), 0), 1) %}
          {% set frac_down = min(max((now_minutes - ramp_down_start) / (ramp_down_end - ramp_down_start), 0), 1) %}
          {% set raw = night_setpoint if now_minutes < ramp_up_start else
                        (night_setpoint + frac_up * (day_setpoint - night_setpoint)) if now_minutes < ramp_up_end else
                        day_setpoint if now_minutes < ramp_down_start else
                        (day_setpoint + frac_down * (night_setpoint - day_setpoint)) if now_minutes < ramp_down_end else
                        night_setpoint %}
          {{ ((raw * 2) | round(0) / 2) }}

  # sensor.minisplit_bme280_corrected removed 2026-09-06: BME280 (and its
  # smoothing sensor, sensor.minisplit_bme280_smoothed) retired in favor of
  # a Zigbee "follow me" temp sensor (sensor.0x18690afffe5602f1_temperature)
  # with no placement bias to correct for and no need for the offset/
  # smoothing this sensor applied. automations.yaml now reads the follow-me
  # entity directly.

  # Combined outage status for the MiniSplit firmware's "Outage Active"
  # (occupancy_7) and "Outage Reason" (humidity_8) endpoints
  # (outage_log.h / matter_device.cpp, 2026-09-01). Reason is a code
  # (0=none, 1=Tuya unreachable, 2=Setpoint mismatch, 3=Device restart,
  # 4=Thread disconnected), not a percentage -- humidity_8 is a repurposed
  # Humidity Sensor endpoint. Reason 4 can only ever show up here *after
  # the fact*, once Thread reattaches -- see outage_log.h's doc comment for
  # why that one can't be reported live.
  #
  # Originally two separate sensors (an "Outage Active" binary_sensor and a
  # "Last Outage Reason" text sensor, which kept showing the last reason
  # even once resolved). Combined 2026-09-01 so one entity answers "is
  # something wrong, and what" at a glance -- state is "Clear" whenever
  # occupancy_7 is off, otherwise the decoded reason string. The full
  # open/close timeline is still free from this entity's own history/
  # logbook, same as the old binary sensor gave.
  #
  # Confirmed live (2026-09-01): humidity_8 appeared automatically after
  # restarting the matter-server container (no full re-pairing or manual
  # re-interview needed) as endpoint 10, picking up the device's
  # "bedroom_" name prefix like the other more-recently-added endpoints
  # (7, 8).
  - trigger:
      - trigger: state
        entity_id:
          - binary_sensor.bedroom_mini_split_ac_bridge_occupancy_7
          - sensor.bedroom_mini_split_ac_bridge_humidity_8
      - trigger: homeassistant
        event: start
    sensor:
      - name: "MiniSplit Outage Status"
        unique_id: minisplit_outage_status
        icon: mdi:alert-circle-outline
        state: >-
          {% if not is_state('binary_sensor.bedroom_mini_split_ac_bridge_occupancy_7', 'on') %}
            Clear
          {% else %}
            {% set code = states('sensor.bedroom_mini_split_ac_bridge_humidity_8') | int(0) %}
            {{ {0: "none", 1: "Tuya unreachable", 2: "Setpoint mismatch",
                3: "Device restart", 4: "Thread disconnected"}.get(code, "unknown") }}
          {% endif %}

  # Friendly relabel + decode for the MiniSplit firmware's Thread parent RSSI
  # endpoint (matter_device.cpp's matter_update_thread_rssi(), 2026-09-01).
  # Originally a repurposed Temperature Sensor endpoint -- confirmed live
  # that was the wrong choice: Home Assistant applies a real C->F conversion
  # to those (127 "°C" rendered as 260.6 "°F"), corrupting the raw dBm
  # value. Switched to a Humidity Sensor endpoint (no unit conversion
  # applied), encoded firmware-side as (rssi_dbm + 128) * 100 since that
  # cluster's value is unsigned. Home Assistant's own /100 division already
  # happens on the Matter side, so this template only needs to undo the
  # +128 offset. 255 decodes from OpenThread's own OT_RADIO_RSSI_INVALID
  # sentinel (127 + 128) -- shown as unknown rather than a fake -1 dBm.
  #
  # 2026-09-09: found this sensor had been stuck on "unknown" since at least
  # 2026-09-03 (confirmed via repeated "Received invalid sensor state:
  # unknown for entity sensor.minisplit_thread_rssi, expected a number"
  # errors in the HA log, spanning 9/3-9/7, well before today's endpoint
  # retargeting) -- unrelated to the endpoint shift, a real pre-existing
  # bug. Root cause: this sensor declares unit_of_measurement, so Home
  # Assistant validates its rendered state as numeric; the old template's
  # `{% else %} unknown {% endif %}` branch produced the literal three-
  # letter STRING "unknown" as a candidate state, which fails that numeric
  # check and gets rejected outright (logged, then the entity is left
  # however it was, which was however this exact failure had already left
  # it -- self-reinforcing once it happens once). Fixed by rendering Jinja's
  # `none` for the invalid case instead of literal text -- that's the
  # actually-blessed way to make a numeric template sensor report unknown,
  # since Home Assistant special-cases a fully-None render rather than
  # trying to parse it as a number.
  - trigger:
      - trigger: state
        entity_id: sensor.bedroom_mini_split_ac_bridge_humidity_9
    sensor:
      - name: "MiniSplit Thread RSSI"
        unique_id: minisplit_thread_rssi
        unit_of_measurement: "dBm"
        icon: mdi:signal
        state: >-
          {% set raw = states('sensor.bedroom_mini_split_ac_bridge_humidity_9') %}
          {% set v = raw | float(-1) | round(0) | int %}
          {{ (v - 128) if (v >= 0 and v != 255) else none }}

  # Compressor duty-cycle estimate feeding the predictive automation's gain
  # (automations.yaml, "MiniSplit FollowMe predictive setpoint correction") --
  # added 2026-09-03 after finding the loop reversing the setpoint on almost
  #
  # 2026-09-08: the trigger/state entity_id below was
  # "binary_sensor.mini_split_ac_bridge_occupancy" with no number -- that
  # entity has never existed (missing the endpoint suffix entirely, a typo
  # from whenever this was written), so this sensor was silently running on
  # the /10-minute timer fallback alone the whole time, never actually
  # decaying toward a fresh compressor-state change until the next tick.
  # Fixed to point at the real Compressor Running entity (also retargeted
  # from endpoint 6 to 4 by the same BME280-removal endpoint shift as
  # everything else on this page).
  # every 10-minute tick during low-load stretches (idle overnight, a mild
  # afternoon) even after the same day's BME280 smoothing/derivative
  # widening: the corrected sensor still swings +-1F within a single
  # 20-30min stretch at idle (BME280 sits in the unit's own supply
  # airflow), and with nothing tracking how much the compressor has
  # actually been running lately, the loop treated that swing exactly like
  # a real room trend and reversed direction to match it every time.
  #
  # An exponential moving average of instantaneous compressor state (1=on,
  # 0=off), not a fixed rolling window -- simulated both against real
  # 9/2-9/3 history before choosing: a fixed window has a hard edge, so a
  # single cycle aging out of it can jump the estimate sharply (one real
  # case: 0% -> 2.9% -> 34.7% across two 10-minute ticks as a cycle entered
  # a 30-minute window). EWMA decays continuously instead, so the same
  # event moves the estimate more gradually (7.8% -> 25.8% in the
  # equivalent case) with no cliff as history ages out. At an equivalent
  # time constant, EWMA halved the write/reversal counts a same-length
  # fixed window got on the same replay (half-life 15-20min: 8 writes / 2
  # reversals over the 9/2 21:00 - 9/3 17:00 replay, vs 14/6 for a 3-hour
  # fixed window) and fully eliminated reversals in the afternoon window
  # that prompted this change.
  #
  # tau = half_life / ln(2); 20-minute half-life -> tau ~= 1731s. Self-
  # referencing (reads its own last state and last_updated), so it needs
  # the trigger form -- decays toward the current compressor state on every
  # occupancy change AND on a 10-minute timer, so it keeps decaying even
  # through a long stretch with no on/off transition at all (matching the
  # cadence the predictive automation reads it at). First run has no prior
  # state, so `ent is not none` guards a clean bootstrap: dt collapses to 0
  # and the sensor starts at 0% (assume no load until proven otherwise)
  # rather than erroring on a nonexistent previous state.
  - trigger:
      - trigger: state
        entity_id: binary_sensor.bedroom_mini_split_ac_bridge_occupancy_4
      - trigger: time_pattern
        minutes: "/10"
      # Without this, the sensor sits at "unknown" after every HA restart
      # until the next occupancy change or /10 tick -- confirmed live
      # 2026-09-03 right after the first deploy (predictive automation
      # still worked, since `| float(0)` degrades load_factor to its 0.15
      # floor rather than erroring, but there's no reason to wait when
      # "MiniSplit Outage Status" above already established this pattern
      # for the same problem).
      - trigger: homeassistant
        event: start
    sensor:
      # Named (not just unique_id'd) so the friendly-name slug lands on
      # sensor.minisplit_duty_cycle_ewma -- `object_id:` isn't a valid key
      # for trigger-based template sensors in this HA version (caught by
      # `check_config` before deploy), so entity_id has to come from the
      # name slug matching what this sensor's own self-reference and
      # automations.yaml's gain formula both expect.
      - name: "MiniSplit Duty Cycle EWMA"
        unique_id: minisplit_duty_cycle_ewma
        unit_of_measurement: "%"
        icon: mdi:sine-wave
        state: >-
          {% set tau = 1731 %}
          {% set ent = states.sensor.minisplit_duty_cycle_ewma %}
          {% set prev = (ent.state | float(0) / 100) if (ent is not none and ent.state not in ['unknown', 'unavailable']) else 0 %}
          {% set last_ts = as_timestamp(ent.last_updated) if ent is not none else as_timestamp(now()) %}
          {% set dt = as_timestamp(now()) - last_ts %}
          {% set instant = 1 if is_state('binary_sensor.bedroom_mini_split_ac_bridge_occupancy_4', 'on') else 0 %}
          {% set decayed = instant + (prev - instant) * (2.718281828459045 ** (-dt / tau)) %}
          {{ (decayed * 100) | round(2) }}

# Timestamp state for the predictive automation's persistent-sign tracking
# (see input_number.minisplit_trend_last_sign above -- 2026-09-06: now
# tracks error-sign persistence, not BME280 trend, entity ID kept for
# continuity). Starts unset ("unknown") until the automation's first run,
# which the relevant template treats as "just started now" rather than
# erroring or computing a nonsense duration.
input_datetime:
  minisplit_trend_sign_since:
    name: "MiniSplit Error Sign Since"
    has_date: true
    has_time: true

# sensor.minisplit_bme280_smoothed (filter platform) and
# sensor.minisplit_bme280_trend (derivative platform) removed 2026-09-06:
# both existed solely to filter BME280's own supply-airflow noise before
# feeding it into the setpoint-correction automations' trend/projected-error
# math. BME280 has been retired for a Zigbee "follow me" temp sensor
# (sensor.0x18690afffe5602f1_temperature), which automations.yaml now reads
# directly with no smoothing or derivative -- see automations.yaml for the
# corresponding removal of lag_minutes/trend_per_hour/projected_error.
