# Floors, areas, device and entity settings, and the default dashboard -- the
# parts of Home Assistant that live in .storage with no YAML support. Applied by
# registry/apply_registry.py on every ./deploy.sh (fully declarative: anything
# set in the UI that isn't here gets reset, and each change is printed).
# `./deploy.sh --registry-check` shows the drift without changing anything.
#
# Areas follow the SmartThings rooms while devices migrate from SmartThings to
# HA ("Main Floor" = SmartThings' "Upstairs"); Shop and TV Room are HA-only.
# devices: matched by the integration's device name, or by `id:`
#   (identifier domain:value) when two devices share a name. `rename:` sets the
#   name shown in HA, `disabled: true` disables it. Unlisted devices: no area.
# entities: only ones with a setting -- area (when it differs from or there's
#   no device), name (overrides the integration's), hidden.
