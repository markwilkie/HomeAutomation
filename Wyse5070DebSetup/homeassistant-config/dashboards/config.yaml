      - entity: switch.hidden_awning_state_on_down
        name: Awning state (on = out)
      - entity: switch.hidden_shade_checker
        name: Shade checker
      - entity: sensor.deck_end_left_shade_2_battery
        name: End left (2) battery
      - entity: sensor.deck_end_right_shade_1_battery
        name: End right (1) battery
      - entity: sensor.deck_middle_side_shade_3_battery
        name: Middle side (3) battery
      - entity: sensor.deck_side_right_shade_4_battery
        name: Side right (4) battery
      - entity: sensor.deck_left_side_shade_5_battery
        name: Left side (5) battery
    - type: markdown
      content: Awning and shade logic runs in SmartThings for now.
  - type: grid
    cards:
    - type: heading
      heading: Firmware
      icon: mdi:update
    - type: entities
      entities:
      - entity: update.deck_end_left_shade_2_firmware
        name: End left shade (2)
      - entity: update.deck_end_right_shade_1_firmware
        name: End right shade (1)
      - entity: update.deck_middle_side_shade_3_firmware
        name: Middle side shade (3)
      - entity: update.deck_side_right_shade_4_firmware
        name: Side right shade (4)
      - entity: update.deck_left_side_shade_5_firmware
        name: Left side shade (5)
      - entity: update.deck_deck_lights_firmware
        name: Deck lights
      - entity: update.deck_bug_light_firmware
        name: Bug light
- title: Under Deck
  path: under-deck
  type: sections
  max_columns: 3
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Spa calibration
      icon: mdi:tune-variant
    - type: entities
      state_color: false
      grid_options:
        columns: full
      entities:
      - entity: sensor.spa_calibration_status
        name: Status
      - entity: input_datetime.spa_last_ph_calibration
        name: pH last calibrated
      - entity: input_number.spa_ph_offset
        name: pH offset (added to the probe's pH)
      - entity: input_datetime.spa_last_orp_calibration
        name: ORP last calibrated
      - entity: input_number.spa_orp_offset
        name: ORP offset (added to the probe's ORP)
      - type: section
        label: 'Probe in solution, wait ~1 min, then press. pH: 7 first, then 4 (10 optional).'
      - type: button
        name: pH 7 buffer
        icon: mdi:numeric-7-circle
        action_name: Calibrate
        tap_action:
          action: perform-action
          perform_action: switch.turn_on
          target:
            entity_id: switch.spa_calibrate_ph_7
      - type: button
        name: pH 4 buffer
        icon: mdi:numeric-4-circle
        action_name: Calibrate
        tap_action:
          action: perform-action
          perform_action: switch.turn_on
          target:
            entity_id: switch.spa_calibrate_ph_4
      - type: button
        name: pH 10 buffer
        icon: mdi:numeric-10-circle
        action_name: Calibrate
        tap_action:
          action: perform-action
          perform_action: switch.turn_on
          target:
            entity_id: switch.spa_calibrate_ph_10
      - type: button
        name: ORP reference (225 mV)
        icon: mdi:flash-triangle-outline
        action_name: Calibrate
        tap_action:
          action: perform-action
          perform_action: switch.turn_on
          target:
            entity_id: switch.spa_calibrate_orp
      - type: button
        name: Clear pH + ORP calibration
        icon: mdi:backup-restore
        action_name: Clear
        tap_action:
          action: perform-action
          perform_action: switch.turn_on
          target:
            entity_id: switch.spa_calibrate_clear
          confirmation:
            text: Reset pH and ORP calibration to factory defaults?
  - type: grid
    cards:
    - type: heading
      heading: Spa alert thresholds
      icon: mdi:alert-circle-outline
    - type: entities
      grid_options:
        columns: full
      entities:
      - entity: input_number.spa_orp_low_mv
        name: Chlorine Low below
      - entity: input_number.spa_orp_high_mv
        name: Chlorine High above
      - entity: input_number.spa_ph_low
        name: pH alert below
      - entity: input_number.spa_ph_high
        name: pH alert above
    - type: markdown
      content: Tune against test strips.
  - type: grid
    cards:
    - type: heading
      heading: Spa alerts & device
      icon: mdi:bell-cog
    - type: entities
      entities:
      - entity: automation.spa_alert_chlorine_low
        name: 'Alert: chlorine low'
      - entity: automation.spa_alert_ph_out_of_range
        name: 'Alert: pH out of range'
      - entity: automation.spa_alert_salt_low
        name: 'Alert: salt low'
      - entity: automation.spa_alert_smarterspa_fault_no_power
        name: 'Alert: SmarterSpa fault / no power'
      - entity: automation.spa_alert_smarterspa_shut_down_salt_over_max
        name: 'Alert: salt shutdown'
      - entity: automation.spa_record_ph_calibration_date
        name: Record pH calibration date
      - entity: automation.spa_record_orp_calibration_date
        name: Record ORP calibration date
    - type: entities
      entities:
      - entity: select.spa_monitor_power_on_behavior_10
        name: Power-on behavior (10)
      - entity: select.spa_monitor_power_on_behavior_11
        name: Power-on behavior (11)
      - entity: select.spa_monitor_power_on_behavior_12
        name: Power-on behavior (12)
      - entity: select.spa_monitor_power_on_behavior_13
        name: Power-on behavior (13)
      - entity: select.spa_monitor_power_on_behavior_14
        name: Power-on behavior (14)
      - entity: update.under_deck_landscape_firmware
        name: Landscape firmware
      title: Devices
