- title: TV Room
  path: tv-room
  type: sections
  max_columns: 3
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Home server radios
      icon: mdi:access-point-network
    - type: entities
      entities:
      - entity: switch.zigbee2mqtt_bridge_permit_join
