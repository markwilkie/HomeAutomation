      - entity: binary_sensor.zigbee2mqtt_bridge_connection_state
        name: Zigbee2MQTT connected
      - entity: select.zigbee2mqtt_bridge_log_level
        name: Zigbee2MQTT log level
      - entity: sensor.zigbee2mqtt_bridge_version
        name: Zigbee2MQTT version
      - entity: update.z_stick_gen5_usb_controller_firmware
        name: Z-Wave stick firmware
      - entity: sensor.upstairs_tv_smoke_detector_battery
        name: Smoke detector battery
