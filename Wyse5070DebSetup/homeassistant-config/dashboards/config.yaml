      - entity: sensor.upstairs_garage_button_battery
        name: Garage button battery
      - entity: update.upstairs_deck_lights_button_firmware
        name: Deck lights button firmware
      - entity: update.upstairs_garage_button_firmware
        name: Garage button firmware
      - entity: update.upstairs_living_room_light_plug_firmware
        name: Living room plug firmware
      - entity: update.upstairs_sengled_dimmer_switch_firmware
