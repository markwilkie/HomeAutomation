# Dashboard 'Config' (/dashboard-config). Deployed by deploy.sh; edit here, not in the HA UI.
views:
- title: Dormer
  path: dormer
  type: sections
  max_columns: 3
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Temperature schedule
      icon: mdi:calendar-clock
    - type: entities
      entities:
      - entity: input_number.minisplit_winter_day
        name: Winter day (09:00-19:00)
      - entity: input_number.minisplit_winter_night
        name: Winter night (22:00-06:00)
      - entity: input_number.minisplit_summer_day
        name: Summer day
      - entity: input_number.minisplit_summer_night
        name: Summer night
      - entity: input_number.minisplit_cool_offset
        name: Cool runs this much above heat
      - entity: sensor.minisplit_season
        name: Season now (% summer)
      - entity: sensor.minisplit_computed_setpoint
        name: Target now
    - type: markdown
      content: Day/night ramps 06:00-09:00 and 19:00-22:00. Season blends winter to summer by the 7-day outdoor average (45F
        and below = winter, 70F and above = summer).
  - type: grid
    cards:
    - type: heading
      heading: Band control (heat)
      icon: mdi:sine-wave
    - type: entities
      entities:
      - entity: input_select.minisplit_followme_experiment
        name: Band control
      - entity: input_number.minisplit_followme_min_run_min
        name: Minimum run (adapts 6-10 min)
      - entity: binary_sensor.minisplit_follow_me_band_active
        name: Active now
      - entity: sensor.minisplit_compressor_starts_last_hour
        name: Starts last hour (max 3)
  - type: grid
    cards:
    - type: heading
      heading: Auto mode (shadow only)
      icon: mdi:sun-snowflake-variant
    - type: entities
      entities:
      - entity: input_number.minisplit_mode_heat_band
        name: Heat wanted below target by
      - entity: input_number.minisplit_mode_cool_band
        name: Cool wanted above target by
      - entity: input_select.minisplit_shadow_mode
        name: Shadow decision
      - entity: binary_sensor.minisplit_shadow_heat_wanted
        name: Heat wanted
      - entity: binary_sensor.minisplit_shadow_cool_wanted
        name: Cool wanted
      - entity: binary_sensor.minisplit_shadow_heat_satisfied
        name: Heat satisfied
      - entity: binary_sensor.minisplit_shadow_cool_satisfied
        name: Cool satisfied
      - entity: input_text.minisplit_shadow_prev_mode
        name: Previous mode
      - entity: input_datetime.minisplit_shadow_last_change
        name: Last change
  - type: grid
    cards:
    - type: heading
      heading: Sensors & bridge
      icon: mdi:thermometer-lines
    - type: entities
      entities:
      - entity: number.0x18690afffe5602f1_temperature_calibration
        name: Follow-Me sensor temp calibration
      - entity: number.0x18690afffe5602f1_humidity_calibration
        name: Follow-Me sensor humidity calibration
      - entity: number.0x70d07efffea47190_temperature_calibration
        name: Hallway sensor temp calibration
      - entity: number.0x70d07efffea47190_humidity_calibration
        name: Hallway sensor humidity calibration
      - entity: switch.minisplit_fresh_air
        name: Fresh air
      - entity: select.bedroom_mini_split_ac_bridge_power_on_behavior
        name: Bridge power-on behavior (5)
      - entity: select.bedroom_mini_split_ac_bridge_power_on_behavior_11
        name: Bridge power-on behavior (11)
      - entity: sensor.minisplit_outage_status
        name: Bridge link
  - type: grid
    cards:
    - type: heading
      heading: Automations
      icon: mdi:robot
    - type: entities
      entities:
      - entity: automation.minisplit_bme280_predictive_setpoint_correction
        name: Schedule setpoint
      - entity: automation.minisplit_follow_me_experiment_control
        name: Band control
      - entity: automation.minisplit_follow_me_experiment_restore
        name: Band restore
      - entity: automation.minisplit_follow_me_experiment_safety_stop
        name: Band safety stop
      - entity: automation.minisplit_compressor_start_log
        name: Compressor start log
      - entity: automation.minisplit_followme_temp_relay_to_firmware
        name: Follow-Me relay
      - entity: automation.minisplit_manual_override_detect
        name: Override detect
      - entity: automation.minisplit_manual_override_end
        name: Override end
      - entity: automation.minisplit_auto_mode_shadow_decision
        name: Auto mode shadow
    - type: entities
      entities:
      - entity: update.0x18690afffe5602f1
        name: Follow-Me sensor firmware
      - entity: update.0x70d07efffea47190
        name: Hallway sensor firmware
      - entity: update.dormer_dormer_shade_firmware
        name: Dormer shade firmware
      title: Firmware
- title: Main Floor
