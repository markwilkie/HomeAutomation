# Dashboard 'Spa' (/spa-dashboard). Deployed by deploy.sh; edit here, not in the HA UI.
# Calibration buttons and thresholds live on the Config dashboard (config.yaml).
#
# Layout: Now and Details on top, then the 24 h and 7 day graphs as full-width
# sections (column_span 3, three graphs per row, each with a pump or chlorinator
# timeline), then Log and Electrode at the end. Graphs use the "per run"
# sensors: a value when readings go live, every 30 min while the pump runs and
# at the end of each run (packages/spa.yaml), so pump-off time shows no stale flatline or pipe cooling.
views:
- title: Spa
  path: spa
  icon: mdi:hot-tub
  type: sections
  max_columns: 3
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Now
      icon: mdi:hot-tub
    - type: tile
      entity: sensor.spa_water_temperature
      name: Water
    - type: tile
      entity: sensor.spa_ph
      name: pH
    - type: tile
      entity: sensor.spa_chlorine
      name: Chlorine
    - type: tile
      entity: sensor.spa_orp
      name: ORP
    - type: tile
      entity: sensor.smarterspa_state
      name: Chlorinator
    - type: tile
      entity: sensor.spa_pump_speed
      name: Pump
    - type: tile
      entity: binary_sensor.spa_readings_live
      name: pH/ORP live
    - type: gauge
      entity: sensor.spa_orp
      name: ORP
      unit: mV
      min: 400
      max: 900
      needle: true
      grid_options:
        columns: full
      segments:
      - from: 400
        color: '#db4437'
      - from: 550
        color: '#ffa600'
      - from: 650
        color: '#43a047'
      - from: 800
        color: '#ffa600'
    - type: gauge
      entity: sensor.spa_ph
      name: pH
      min: 6.5
      max: 8.5
      needle: true
      grid_options:
        columns: full
      segments:
      - from: 6.5
        color: '#db4437'
      - from: 7.2
        color: '#43a047'
      - from: 7.8
        color: '#db4437'
  - type: grid
    cards:
    - type: heading
      heading: Details
      icon: mdi:information-outline
    - type: entities
      grid_options:
        columns: full
      entities:
      - entity: sensor.spa_orp
        name: ORP (live)
      - entity: sensor.spa_pump_current
        name: Pump current
      - entity: sensor.spa_pump_runtime_24h
        name: Pump runtime (24 h)
      - entity: sensor.smarterspa_generating_24h
        name: Generating (24 h)
      - entity: sensor.smarterspa_readout
        name: SmarterSpa flash readout (DOWN in standby = chlorine sensor)
  - type: grid
    column_span: 3
    cards:
    - type: heading
      heading: Last 24 hours (pump-running readings only)
      icon: mdi:chart-line
    - type: history-graph
      hours_to_show: 24
      grid_options:
        columns: 12
      entities:
      - entity: sensor.spa_ph_per_run
        name: pH
      - entity: binary_sensor.spa_pump_running
        name: Pump
      - entity: sensor.spa_chemistry_log
        name: Log
    - type: history-graph
      hours_to_show: 24
      grid_options:
        columns: 12
      entities:
      - entity: sensor.spa_orp_per_run
        name: ORP
      - entity: binary_sensor.smarterspa_generating
        name: Generating
      - entity: sensor.spa_chemistry_log
        name: Log
    - type: history-graph
      hours_to_show: 24
      grid_options:
        columns: 12
      entities:
      - entity: sensor.spa_water_temperature_per_run
        name: Water
      - entity: binary_sensor.spa_pump_running
        name: Pump
  - type: grid
    column_span: 3
    cards:
    - type: heading
      heading: Last 7 days (pump-running readings only)
      icon: mdi:chart-timeline-variant
    - type: history-graph
      hours_to_show: 168
      grid_options:
        columns: 12
      entities:
      - entity: sensor.spa_ph_per_run
        name: pH
      - entity: binary_sensor.spa_pump_running
        name: Pump
      - entity: sensor.spa_chemistry_log
        name: Log
    - type: history-graph
      hours_to_show: 168
      grid_options:
        columns: 12
      entities:
      - entity: sensor.spa_orp_per_run
        name: ORP
      - entity: binary_sensor.smarterspa_generating
        name: Generating
    - type: history-graph
      hours_to_show: 168
      grid_options:
        columns: 12
      entities:
      - entity: sensor.spa_water_temperature_per_run
        name: Water
      - entity: binary_sensor.spa_pump_running
        name: Pump
  - type: grid
    cards:
    - type: heading
      heading: Log what you add
      icon: mdi:flask-outline
    - type: tile
      entity: input_button.spa_log_ph_down
      name: pH down
      tap_action:
        action: perform-action
        perform_action: input_button.press
        target:
          entity_id: input_button.spa_log_ph_down
    - type: tile
      entity: input_button.spa_log_salt
      name: Salt
      tap_action:
        action: perform-action
        perform_action: input_button.press
        target:
          entity_id: input_button.spa_log_salt
    - type: tile
      entity: input_button.spa_log_boost
      name: Boost
      tap_action:
        action: perform-action
        perform_action: input_button.press
        target:
          entity_id: input_button.spa_log_boost
    - type: tile
      entity: input_button.spa_log_strip_test
      name: Strip test
      tap_action:
        action: perform-action
        perform_action: input_button.press
        target:
          entity_id: input_button.spa_log_strip_test
    - type: logbook
      hours_to_show: 336
      grid_options:
        columns: full
      entities:
      - input_button.spa_log_ph_down
      - input_button.spa_log_salt
      - input_button.spa_log_boost
      - input_button.spa_log_strip_test
  - type: grid
    cards:
    - type: heading
      heading: Electrode
      icon: mdi:timer-sand
    - type: entities
      grid_options:
        columns: full
      entities:
      - entity: sensor.spa_electrode_hours
        name: Electrode hours (life ~7,000-10,000 h)
      - entity: sensor.spa_electrode_life_used
        name: Life used (SmarterSpa Boost+Down shows the same %)
      - entity: input_datetime.spa_electrode_installed
        name: Installed
      - entity: input_number.spa_electrode_hours_at_install
        name: Hours it had before SpaV2 counted
      - type: button
        name: New electrode installed
        icon: mdi:autorenew
        action_name: Reset
        tap_action:
          action: perform-action
          perform_action: script.spa_new_electrode
          confirmation:
            text: Start the new electrode's hours at 0? Also press all three SmarterSpa buttons at once to reset its own counter.
