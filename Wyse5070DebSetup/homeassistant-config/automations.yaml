- id: '1787800000001'
  alias: MiniSplit schedule setpoint
  description: >-
    2026-11-22: writes the schedule's target (sensor.minisplit_computed_setpoint:
    day/night ramps blended by season) to Desired, rounded half-up to whole F,
    while thermostat_6 is in Heat or Cool and there's no manual override.
    That's all. It replaced the "predictive setpoint correction" controller
    (adaptive gain, room clamp, target bound, 29-min cooldown), which existed
    to compensate for the unit judging the room by its own ~3-4F-warm sensor.
    With Follow-Me the unit sees the real room, and in Heat band control
    (packages/minisplit_followme_band.yaml) decides start/stop itself, so the
    controller had been forced into "direct" anyway. Design history:
    history/setpoint-automation.md.

    Writes only when the target is a whole degree or more from Desired, so a
    target sitting on x.5 (seasonal drift) can't flap Desired. A target
    change has to hold 2 minutes, so a config-reload blip can't write. Each
    write records its value in input_number.minisplit_schedule_setpoint first
    so the override detector can tell it apart from a manual change.
    Entity id (automation.minisplit_bme280_predictive_setpoint_correction)
    kept from the old automation; Manual Override End triggers it.
  initial_state: true
  triggers:
  - trigger: state
    entity_id: sensor.minisplit_computed_setpoint
    for: "00:02:00"
  - trigger: time_pattern
    minutes: /10
  conditions:
  - condition: template
    value_template: "{{ states('climate.bedroom_mini_split_ac_bridge_thermostat_6') in ['heat', 'cool'] }}"
  - condition: state
    entity_id: binary_sensor.minisplit_manual_override
    state: "off"
  - condition: template
    value_template: "{{ is_number(states('sensor.minisplit_computed_setpoint')) }}"
  actions:
  - variables:
      target_temp: "{{ states('sensor.minisplit_computed_setpoint') | float }}"
      current_setpoint: "{{ state_attr('climate.bedroom_mini_split_ac_bridge_thermostat_6', 'temperature') | float(0) }}"
      new_setpoint: "{{ (target_temp + 0.5) | round(0, 'floor') }}"
  - condition: template
    value_template: "{{ (target_temp - current_setpoint) | abs >= 1 and new_setpoint != current_setpoint }}"
  - action: input_number.set_value
    target:
      entity_id: input_number.minisplit_schedule_setpoint
    data:
      value: "{{ new_setpoint }}"
  - action: climate.set_temperature
    target:
      entity_id: climate.bedroom_mini_split_ac_bridge_thermostat_6
    data:
      temperature: "{{ new_setpoint }}"
  mode: single
- id: '1788809000000'
  alias: MiniSplit FollowMe temp relay to firmware
  description: >-
    Relays the Zigbee "follow me" sensor's real reading straight to the
    MiniSplit firmware's own Follow-Me Matter endpoint
    (climate.bedroom_mini_split_ac_bridge_thermostat_10, endpoint 10) every
    time it updates. Added 2026-09-07 as part of that milestone's final
    architecture (was endpoint 12/thermostat_12 until the 2026-09-08 BME280
    removal shifted every later endpoint down by 2 -- see thermostat_6's
    note above, same repoint, same reason): the firmware originally tried
    running its own MQTT client
    directly against Mosquitto, but that connection never worked on this
    Thread-only device (no usable DNS/NAT64 path found after several
    attempts -- see MiniSplit/PLAN.md Milestone 3 for the full writeup), so
    HA relays the value instead, the same way it already does for
    thermostat_6's Desired Setpoint. No unit conversion applied -- passed
    straight through in Celsius, matching how this same sensor is already
    compared directly against thermostat_6's `temperature` attribute
    elsewhere (the old predictive setpoint controller did) with no
    conversion, confirming Matter climate attributes read in
    Celsius via templates regardless of the frontend's display unit.

    2026-10-05: throttled. It relayed every sensor update (~75/hour), each a
    Matter write over Thread plus an NVS commit on the bridge, but the
    firmware only uses whole degrees C (IR state[11]). Now relays only when
    the whole-C value changes -- same half-up rounding as the firmware -- or
    when the bridge's copy (thermostat_10) is 1F+ off the reading, which
    catches a dropped write or a restart. (Units: the sensor and
    thermostat_10 both read in F in HA; climate.set_temperature takes F and
    HA converts to Matter's C.)
  triggers:
    - trigger: state
      entity_id: sensor.0x18690afffe5602f1_temperature
  conditions:
    - condition: template
      value_template: "{{ trigger.to_state.state not in ['unknown', 'unavailable', 'none'] }}"
    # 2026-11-20: Follow-Me band control sends its own values while active
    # (packages/minisplit_followme_band.yaml).
    - condition: state
      entity_id: binary_sensor.minisplit_follow_me_band_active
      state: "off"
    - condition: template
      value_template: >-
        {% set to_c = (((trigger.to_state.state | float - 32) * 5 / 9) + 0.5) | round(0, 'floor') %}
        {% set from_ok = trigger.from_state is not none and trigger.from_state.state not in ['unknown', 'unavailable', 'none'] %}
        {% set from_c = ((((trigger.from_state.state | float(0)) - 32) * 5 / 9) + 0.5) | round(0, 'floor') if from_ok else none %}
        {% set relayed = state_attr('climate.bedroom_mini_split_ac_bridge_thermostat_10', 'temperature') %}
        {{ from_c is none or to_c != from_c or relayed is none
           or ((trigger.to_state.state | float) - (relayed | float(0))) | abs >= 1 }}
  actions:
    - action: climate.set_temperature
      target:
        entity_id: climate.bedroom_mini_split_ac_bridge_thermostat_10
      data:
        temperature: "{{ trigger.to_state.state | float }}"
  mode: single
- id: '1789600000000'
  alias: MiniSplit Auto Mode Shadow Decision
  description: >-
    PLAN_AUTO_MODE.md Phase 0 -- shadow-only. Computes what Off/Cool/Heat
    decision the planned mode-selection automation would make, writing only
    to input_select.minisplit_shadow_mode (never climate.set_hvac_mode --
    this automation cannot touch the real unit). Exists so the decision
    logic can be evaluated against what a human actually did, across a real
    range of conditions, before any live control is attempted. Design goal:
    once a mode is picked it holds for hours, and a change only happens when
    the weather backs it up.

    How it decides (2026-10-04 rework, see below for why): the "is this mode
    warranted" and "is this mode done" conditions live in four template
    binary sensors in configuration.yaml (MiniSplit Shadow Cool/Heat Wanted,
    Cool/Heat Satisfied), each held for 30 minutes before reading on. This
    automation adds only the bookkeeping those can't hold: from Off, enter
    Cool when Cool Wanted is on (Heat likewise); from Cool, return to Off
    when Cool Satisfied is on (Heat likewise); never change more than once
    per 2 hours; and never enter the opposite mode within 6 hours of leaving
    one (input_text.minisplit_shadow_prev_mode records which mode was last
    active). Skips the tick entirely if any of the four is unavailable --
    "don't act on missing data," same as outage_log and the duty-cycle EWMA.
    `unknown` is NOT skipped: a delay_on sensor whose condition is already
    true reads unknown until its 30 minutes have elapsed, which just means
    "not held long enough yet" (treated as off). Skipping it too (the first
    version, 2026-10-04) meant the automation never ran for 30 minutes
    after every HA restart -- and there were five that day.

    Rules (2026-10-05 evening, see configuration.yaml's binary sensors):
    Cool wanted = room more than the band (1.5F) above the cool target, held
    2 hours; Heat wanted = room more than the band below the heat target,
    held 2 hours. No weather gate: outdoor-only blocked cooling a heat-soaked
    house on cool evenings, and outdoor-or-hallway and trend projections
    changed no decision in replay -- the 2-hour hold is the "would doing
    nothing work" check. Satisfied = room back at the mode's target (was 1F past it
    until 2026-10-07), held 30 minutes. Targets are
    sensor.minisplit_cool_target / heat_target (since 2026-10-06 one seasonal
    target: heat at it, cool at target + offset). The 2026-10-04 version's trend-based early trigger, 3h
    outdoor-trend gate, fixed 65F/60F outdoor gates and outdoor-based exits
    were removed -- in replay they never changed an outcome, and the fixed
    gates were wrong in mild weather (no heat for a cold room on a 62F
    morning).

    2026-10-04 rework, after 3 days of re-enabled shadow data (it had been
    off since ~2026-09-15): 33 cool<->off flips in 3 days, ~every 2 hours
    around the clock, while the real unit sat in Heat with the compressor
    idle and the right answer was Off throughout (outdoor 50-54F lows,
    70-79F highs; room never fell below the heat target). Causes, each
    fixed above:
    (1) error was Follow-Me minus thermostat_6's *current* setpoint -- the
    heat target, while heating -- so "room 2F above the heat target" read
    as "needs cooling." Now each mode is judged against its own target, and
    the gap between heat and cool targets is the natural do-nothing zone.
    (2) Cool/Heat -> Off exited on compressor_idle (duty_cycle_ewma < 5%,
    added 2026-09-10). With the real unit in Heat and satisfied, the
    compressor is always idle, so every exit landed exactly when the 2h
    dwell expired and re-entry followed 2h later -- the dwell floor set the
    flip frequency instead of preventing flips. Now exit requires the room
    actually overshooting the target by 1F (or the weather turning).
    (3) The predictive early trigger skipped the outdoor gate, which is how
    it called Cool at 2:40am with 52F outside; the old 40F/80F "sanity
    guard" was far too loose to catch it. Now every entry path is gated.
    (4) A single 10-minute reading could flip the decision; now 30 minutes.
    (5) input_select's `initial: "off"` reset the decision on every HA
    restart (a 2026-10-04 restart caused a spurious flip); removed.
    Replayed against all retained history (2026-09-24..10-04, incl. 86-90F
    afternoons and 42-50F nights): 0 changes, vs. 28 under the old rules.
    The half-band floor on the predictive path and the 1F exit overshoot
    were each needed for that -- without them, trend noise from a 30-minute
    sun spike on the outdoor unit triggered Heat 0.1F from target on
    2026-09-25, then exiting at target re-entered 3 hours later.

    Still-valid history: the 2026-09-10 availability guard (thermostat_6
    unavailable for 2h turned a `| float(0)` fallback into ~70F bogus
    errors) is kept as the skip-on-unavailable rule above. Follow-Me's own
    trend is deliberately still not a predictor -- the predictive setpoint
    automation found it mostly measures this unit's own ~25-35min duty
    cycle; hallway/outdoor trends aren't affected by it. Units confirmed
    consistent (all F) 2026-09-09.
  triggers:
    - trigger: time_pattern
      minutes: "/10"
  conditions:
    - condition: template
      value_template: >-
        {{ not is_state('binary_sensor.minisplit_shadow_cool_wanted', 'unavailable') and
           not is_state('binary_sensor.minisplit_shadow_heat_wanted', 'unavailable') and
           not is_state('binary_sensor.minisplit_shadow_cool_satisfied', 'unavailable') and
           not is_state('binary_sensor.minisplit_shadow_heat_satisfied', 'unavailable') }}
  actions:
    - variables:
        current_mode: "{{ states('input_select.minisplit_shadow_mode') }}"
        prev_mode: "{{ states('input_text.minisplit_shadow_prev_mode') }}"
        last_change: "{{ states('input_datetime.minisplit_shadow_last_change') }}"
        since_change: >-
          {{ (as_timestamp(now()) - as_timestamp(last_change, 0)) if last_change not in ['unknown', 'unavailable', ''] else 999999 }}
        cool_wanted: "{{ is_state('binary_sensor.minisplit_shadow_cool_wanted', 'on') }}"
        heat_wanted: "{{ is_state('binary_sensor.minisplit_shadow_heat_wanted', 'on') }}"
        cool_satisfied: "{{ is_state('binary_sensor.minisplit_shadow_cool_satisfied', 'on') }}"
        heat_satisfied: "{{ is_state('binary_sensor.minisplit_shadow_heat_satisfied', 'on') }}"
    - variables:
        target_zone: >-
          {{ ('off' if cool_satisfied else 'cool') if current_mode == 'cool' else
             ('off' if heat_satisfied else 'heat') if current_mode == 'heat' else
             'cool' if (cool_wanted and not (prev_mode == 'heat' and since_change < 21600)) else
             'heat' if (heat_wanted and not (prev_mode == 'cool' and since_change < 21600)) else
             'off' }}
    - if:
        - condition: template
          value_template: "{{ since_change > 7200 and target_zone != current_mode }}"
      then:
        - if:
            - condition: template
              value_template: "{{ current_mode in ['cool', 'heat'] }}"
          then:
            - action: input_text.set_value
              target:
                entity_id: input_text.minisplit_shadow_prev_mode
              data:
                value: "{{ current_mode }}"
        - action: input_select.select_option
          target:
            entity_id: input_select.minisplit_shadow_mode
          data:
            option: "{{ target_zone }}"
        - action: input_datetime.set_datetime
          target:
            entity_id: input_datetime.minisplit_shadow_last_change
          data:
            datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
  mode: single
- id: '1789700000001'
  alias: MiniSplit Manual Override Detect
  description: >-
    2026-10-05. Desired's setpoint changed to something the setpoint
    automation didn't write (input_number.minisplit_schedule_setpoint) --
    i.e. set on the HA card, or on the remote/app and adopted by the bridge
    firmware (1.2.0+: it tells a remote change from a missed IR update by
    whether the unit moved to a value the bridge didn't send). Holds the
    schedule off until the next day/night change: 06:00 or 19:00, whichever
    comes first. A mode change from the remote doesn't count (the firmware
    keeps the schedule's temperature for it), and any Desired mode change
    ends an override (next automation).
  triggers:
    - trigger: state
      entity_id: climate.bedroom_mini_split_ac_bridge_thermostat_6
      attribute: temperature
  conditions:
    - condition: template
      value_template: >-
        {{ trigger.from_state is not none and trigger.to_state is not none
           and trigger.from_state.state not in ['unknown', 'unavailable']
           and trigger.to_state.state in ['heat', 'cool']
           and trigger.from_state.attributes.temperature is not none
           and trigger.to_state.attributes.temperature is not none
           and ((trigger.to_state.attributes.temperature | float)
                - (states('input_number.minisplit_override_setpoint') if is_state('binary_sensor.minisplit_manual_override', 'on')
                   else states('input_number.minisplit_schedule_setpoint')) | float(0)) | abs >= 0.5 }}
  actions:
    # 2026-11-21: a 1F "remote" change is the unit's setpoint slipping half
    # a degree C on its own (5 times 2026-11-18..21, none by hand -- see
    # history/followme-experiment-2026-11-20.md), not a person. Put the
    # schedule's value back instead of holding it as an override. Real
    # remote changes of 2F+ (or any change from the HA card) still count.
    - if:
        - condition: template
          value_template: >-
            {{ not trigger.to_state.context.user_id
               and ((trigger.to_state.attributes.temperature | float)
                    - (states('input_number.minisplit_override_setpoint') if is_state('binary_sensor.minisplit_manual_override', 'on')
                       else states('input_number.minisplit_schedule_setpoint')) | float(0)) | abs <= 1 }}
      then:
        # During an override the slip goes back to the override's value.
        - variables:
            slipped: "{{ trigger.to_state.attributes.temperature | float }}"
            schedule_back: >-
              {{ (states('input_number.minisplit_override_setpoint') if is_state('binary_sensor.minisplit_manual_override', 'on')
                  else states('input_number.minisplit_schedule_setpoint')) | float(0) }}
        - action: climate.set_temperature
          target:
            entity_id: climate.bedroom_mini_split_ac_bridge_thermostat_6
          data:
            temperature: "{{ schedule_back }}"
        - action: logbook.log
          data:
            name: "MiniSplit setpoint"
            message: "unit slipped to {{ slipped }}F on its own -- put back to {{ schedule_back }}F (not an override)"
            entity_id: climate.bedroom_mini_split_ac_bridge_thermostat_6
        - action: shell_command.minisplit_log_override
          data:
            when: "{{ now().strftime('%Y-%m-%dT%H:%M:%S') }}"
            chosen: "{{ slipped }}"
            schedule: "{{ schedule_back }}"
            outdoor_7d: "{{ states('sensor.minisplit_outdoor_7d_avg') }}"
            room: "{{ states('sensor.0x18690afffe5602f1_temperature') }}"
            season: "{{ states('sensor.minisplit_season') }}"
            mode: "{{ trigger.to_state.state }}"
            source: "slip"
        - stop: "1F slip, not an override"
    - action: input_number.set_value
      target:
        entity_id: input_number.minisplit_override_setpoint
      data:
        value: "{{ trigger.to_state.attributes.temperature | float }}"
    - action: input_datetime.set_datetime
      target:
        entity_id: input_datetime.minisplit_override_until
      data:
        datetime: >-
          {% set t7 = today_at('06:00') %}{% set t19 = today_at('19:00') %}
          {{ (t7 if now() < t7 else t19 if now() < t19 else t7 + timedelta(days=1)).strftime('%Y-%m-%d %H:%M:%S') }}
    # 2026-10-06: record it -- the evidence for tuning the seasonal
    # winter/summer targets. A change with a user behind it came from HA (the
    # card or the API); without one, it's the firmware adopting a remote/app
    # change.
    - variables:
        chosen: "{{ trigger.to_state.attributes.temperature | float }}"
        schedule: "{{ states('input_number.minisplit_schedule_setpoint') | float(0) }}"
        outdoor_7d: "{{ states('sensor.minisplit_outdoor_7d_avg') }}"
        room: "{{ states('sensor.0x18690afffe5602f1_temperature') }}"
        season: "{{ states('sensor.minisplit_season') }}"
        source: "{{ 'ha' if trigger.to_state.context.user_id else 'remote' }}"
    - action: input_text.set_value
      target:
        entity_id: input_text.minisplit_last_override
      data:
        value: >-
          {{ chosen }}F by {{ source }} at {{ now().strftime('%a %H:%M') }} (schedule {{ schedule }}F,
          room {{ room }}F, 7-day outdoor {{ outdoor_7d }}F, season {{ season }}% summer)
    - action: shell_command.minisplit_log_override
      data:
        when: "{{ now().strftime('%Y-%m-%dT%H:%M:%S') }}"
        chosen: "{{ chosen }}"
        schedule: "{{ schedule }}"
        outdoor_7d: "{{ outdoor_7d }}"
        room: "{{ room }}"
        season: "{{ season }}"
        mode: "{{ trigger.to_state.state }}"
        source: "{{ source }}"
  mode: queued
- id: '1789700000002'
  alias: MiniSplit Manual Override End
  description: >-
    2026-10-05. Ends a manual override early: on the dashboard's Resume
    Schedule button, or when Desired's mode changes (Heat/Cool/Off/Auto, from
    HA or adopted from the remote). Runs the schedule setpoint automation right
    away so the schedule's temperature goes back at once.
  triggers:
    - trigger: state
      entity_id: input_button.minisplit_resume_schedule
      id: resume
    - trigger: state
      entity_id: climate.bedroom_mini_split_ac_bridge_thermostat_6
      id: mode
  conditions:
    - condition: template
      value_template: >-
        {{ trigger.id == 'resume'
           or (trigger.from_state is not none and trigger.to_state is not none
               and trigger.from_state.state not in ['unknown', 'unavailable']
               and trigger.to_state.state not in ['unknown', 'unavailable']
               and trigger.from_state.state != trigger.to_state.state) }}
  actions:
    - action: input_datetime.set_datetime
      target:
        entity_id: input_datetime.minisplit_override_until
      data:
        datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
    - delay: "00:00:05"
    - action: automation.trigger
      target:
        entity_id: automation.minisplit_bme280_predictive_setpoint_correction
      data:
        skip_condition: false
  mode: single
- id: '1789700000003'
  alias: SmartThings Stream Watchdog
  description: >-
    2026-10-06. HA's SmartThings integration receives device changes over a
    pushed event stream, which dropped silently at ~16:04 that day: the roof
    weather station kept reporting in the SmartThings app, but HA got nothing
    (no log error) until the integration was reloaded. If the station's
    temperature hasn't been reported for 45 min (it normally reports ~every
    10), reload the integration -- at most once an hour.
    sensor.minisplit_outdoor_temp falls back to the unit's own reading after
    30 min in the meantime.
  triggers:
    - trigger: time_pattern
      minutes: /15
  conditions:
    - condition: template
      value_template: >-
        {% set s = states.sensor.roof_weather_device_temperature %}
        {{ s is not none and (now() - s.last_reported).total_seconds() > 2700 }}
    - condition: template
      value_template: >-
        {% set last = this.attributes.last_triggered %}
        {{ last is none or (now() - last).total_seconds() > 3600 }}
  actions:
    - action: homeassistant.reload_config_entry
      data:
        entry_id: 01M46WFF0GRHJ4GXTNEAM20FE6
  mode: single
