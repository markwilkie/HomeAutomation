# SpaV2 spa monitor: Home Assistant package.
#
# Decodes the Spa Monitor's repurposed Matter endpoints (MiniSplit's pattern,
# see PLAN.md "Matter endpoint map") into real entities, and adds tunable
# thresholds, 24 h stats, calibration dates and alerts. Expects the stable
# entity ids that rename_entities.py assigns after commissioning. Install steps:
# README.md in this folder.
#
# Rules carried over from MiniSplit's templates:
#   - HA has already divided each repurposed Humidity value by 100.
#   - Numeric sensors render `none` when invalid, never the string "unknown"
#     (that fails HA's numeric check; MiniSplit's RSSI sensor stuck for days).

input_number:
  spa_orp_low_mv:
    name: "Spa ORP: below this = chlorine Low"
    min: 300
    max: 900
    step: 5
    unit_of_measurement: mV
    icon: mdi:flask-minus
  spa_orp_high_mv:
    name: "Spa ORP: above this = chlorine High"
    min: 400
    max: 1000
    step: 5
    unit_of_measurement: mV
    icon: mdi:flask-plus
  spa_ph_low:
    name: "Spa pH alert below"
    min: 6.0
    max: 8.0
    step: 0.05
    icon: mdi:ph
  spa_ph_high:
    name: "Spa pH alert above"
    min: 6.5
    max: 9.0
    step: 0.05
    icon: mdi:ph
  # Added to the firmware's pH / ORP. Stopgaps until the probes are properly
  # calibrated (then set both back to 0). 2026-11-17, after swapping the
  # pH/ORP wires and a fresh fill: strip pH ~7.1 vs probe 7.72 -> -0.6; ORP
  # shifted so the strip's usual sanitizer level reads mid "Good".
  spa_ph_offset:
    name: "Spa pH offset"
    min: -6.0
    max: 6.0
    step: 0.05
    mode: box
    icon: mdi:plus-minus-variant
  spa_orp_offset:
    name: "Spa ORP offset"
    min: -1000
    max: 1000
    step: 5
    unit_of_measurement: mV
    mode: box
    icon: mdi:plus-minus-variant
  # Electrode hours = Spa Monitor count - count at install + hours it already had.
  # The firmware's count (endpoint 8) never resets: it's the monitor's lifetime
  # generating time. "New electrode installed" (script below) zeroes this
  # electrode's hours. 2026-11-25: the old electrode, still in use, read 39% of
  # ~7,000 h on the SmarterSpa (Boost+Down) -> 2,730 h at monitor count 12.
  spa_electrode_hours_at_install:
    name: "Spa electrode hours before counting"
    min: 0
    max: 20000
    step: 1
    unit_of_measurement: h
    mode: box
    icon: mdi:timer-sand
  spa_electrode_monitor_count_at_install:
    name: "Spa Monitor hours at electrode install"
    min: 0
    max: 100000
    step: 1
    unit_of_measurement: h
    mode: box
    icon: mdi:counter

# No `initial:` on purpose: it would reset tuned values on every restart. A
# brand-new input_number starts at its `min`, so the "spa_seed_thresholds"
# automation below sets the starting values once (PLAN.md: Low < 650,
# Good 650-800, High > 800; pH 7.2-7.8) and never touches them again.
input_datetime:
  spa_last_ph_calibration:
    name: "Spa pH last calibrated"
    has_date: true
    has_time: true
  spa_last_orp_calibration:
    name: "Spa ORP last calibrated"
    has_date: true
    has_time: true
  spa_electrode_installed:
    name: "Spa electrode installed"
    has_date: true
    has_time: false

# Dashboard "Log" buttons: a press is the record (logbook + the timeline sensor
# "Spa chemistry log" below).
input_button:
  spa_log_ph_down:
    name: "Spa: pH down added"
    icon: mdi:arrow-down-bold-circle-outline
  spa_log_salt:
    name: "Spa: salt added"
    icon: mdi:shaker-outline
  spa_log_boost:
    name: "Spa: boost pressed"
    icon: mdi:rocket-launch-outline
  spa_log_strip_test:
    name: "Spa: strip test"
    icon: mdi:test-tube

template:
  - sensor:
      - name: "Spa water temperature"
        unique_id: spa_water_temperature
        device_class: temperature
        state_class: measurement
        unit_of_measurement: "°F"
        # The firmware sends -273.15 C (shown here already converted to HA's
        # unit) when the DS18B20 has no reading, never null (matter_device.cpp).
        state: >-
          {% set v = states('sensor.spa_water_temperature_raw') | float(-999) %}
          {% set c = state_attr('sensor.spa_water_temperature_raw', 'unit_of_measurement') == '°C' %}
          {% if v < -100 %}{{ none }}
          {% else %}{{ (v * 9 / 5 + 32 if c else v) | round(1) }}{% endif %}

      - name: "Spa pH"
        unique_id: spa_ph
        device_class: ph
        state_class: measurement
        icon: mdi:ph
        # firmware sends pH x100 (0 = no reading yet); HA's /100 gives pH directly
        state: >-
          {% set v = states('sensor.spa_ph_raw') | float(-1) %}
          {% set off = states('input_number.spa_ph_offset') | float(0) %}
          {{ ([0, [14, v + off] | min] | max) | round(2) if 0 < v < 14 else none }}

      - name: "Spa ORP"
        unique_id: spa_orp
        unit_of_measurement: mV
        device_class: voltage
        state_class: measurement
        icon: mdi:flash-triangle-outline
        # firmware sends mV + 2000 (unsigned, 0 = no reading yet); HA's /100 -> x100 - 2000
        state: >-
          {% set v = states('sensor.spa_orp_raw') | float(0) %}
          {% set off = states('input_number.spa_orp_offset') | float(0) %}
          {{ (v * 100 - 2000 + off) | round(0) if v > 0 else none }}

      - name: "Spa chlorine"
        unique_id: spa_chlorine
        # Label from ORP; boundaries are the input_numbers above, tuned against
        # test strips (PLAN.md Phase 3, "ORP label tuning").
        state: >-
          {% set mv = states('sensor.spa_orp') %}
          {% if not is_number(mv) %}{{ none }}
          {% elif mv | float < states('input_number.spa_orp_low_mv') | float(650) %}Low
          {% elif mv | float > states('input_number.spa_orp_high_mv') | float(800) %}High
          {% else %}Good{% endif %}
        icon: >-
          {% set s = this.state %}
          {{ 'mdi:water-alert' if s == 'Low' else 'mdi:water-plus' if s == 'High' else 'mdi:water-check' }}

      - name: "Spa pump current"
        unique_id: spa_pump_current
        unit_of_measurement: A
        device_class: current
        state_class: measurement
        # firmware sends A x100; HA's /100 gives amps
        state: >-
          {% set v = states('sensor.spa_pump_current_raw') %}
          {{ v | float | round(2) if is_number(v) else none }}

      - name: "Spa pump speed"
        unique_id: spa_pump_speed
        icon: mdi:pump
        # Clamp on the pump's white common wire (moved off heater lead P4 on 2026-11-22):
        # low 3.0 A, high 9.4 A, noise ~0.15 A. Split at 6 A.
        # Off follows the firmware's running flag (on > 1.5 A, off < 1.0 A).
        state: >-
          {% set a = states('sensor.spa_pump_current') %}
          {% if not is_number(a) %}{{ none }}
          {% elif is_state('binary_sensor.spa_pump_running', 'off') %}Off
          {% elif a | float > 6 %}High
          {% else %}Low{% endif %}

      - name: "SmarterSpa state"
        unique_id: smarterspa_state
        icon: mdi:shaker-outline
        # firmware spa_state_t (src/spa_leds.h) x100; HA's /100 gives the code
        state: >-
          {% set v = states('sensor.spa_smarterspa_state_raw') %}
          {% set names = {0: 'Unknown', 1: 'Standby', 2: 'Generating', 3: 'Salt low',
                          4: 'Salt high', 5: 'Shut down (salt over max)', 6: 'Fault / no power'} %}
          {{ names.get(v | float | round(0) | int, 'Unknown') if is_number(v) else none }}

      - name: "Spa electrode hours"
        unique_id: spa_electrode_hours
        unit_of_measurement: h
        state_class: total_increasing
        icon: mdi:timer-sand
        # This electrode's generating hours (see input_number.spa_electrode_hours_at_install).
        # Firmware sends the monitor's lifetime whole hours; HA's /100 -> x100.
        state: >-
          {% set v = states('sensor.spa_electrode_hours_raw') %}
          {% if is_number(v) %}
            {% set count = (v | float * 100) | round(0) | int %}
            {% set at_install = states('input_number.spa_electrode_monitor_count_at_install') | int(0) %}
            {% set before = states('input_number.spa_electrode_hours_at_install') | int(0) %}
            {{ [count - at_install, 0] | max + before }}
          {% else %}{{ none }}{% endif %}

      - name: "Spa electrode life used"
        unique_id: spa_electrode_life_used
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:battery-clock-outline
        # Same scale as the SmarterSpa's Boost+Down readout: % of ~7,000 generating hours.
        state: >-
          {% set h = states('sensor.spa_electrode_hours') %}
          {{ (h | float / 7000 * 100) | round(0) | int if is_number(h) else none }}

      - name: "SmarterSpa readout"
        unique_id: smarterspa_readout
        icon: mdi:counter
        # Last counted-flash readout, yellow x100 + blue x10 + red x1 (manual p. 14).
        # Its meaning depends on the button pressed (DOWN in standby = chlorine sensor mV).
        # Firmware sends the value raw (endpoint 15); HA's /100 -> x100. 0 = none since boot.
        state: >-
          {% set v = states('sensor.smarterspa_readout_raw') %}
          {% set n = (v | float * 100) | round(0) | int if is_number(v) else 0 %}
          {{ n if n > 0 else none }}

      - name: "Spa calibration status"
        unique_id: spa_calibration_status
        icon: mdi:tune-variant
        # firmware cal_status_t (src/probes.h) x100
        state: >-
          {% set v = states('sensor.spa_calibration_status_raw') %}
          {% set names = {0: 'Not calibrated since restart', 1: 'OK', 2: 'Unstable: wait, then press again',
                          3: 'Out of range: check the solution / probe', 4: 'Cleared',
                          5: 'No signal from isolator', 6: 'Calibrating...'} %}
          {{ names.get(v | float | round(0) | int, 'Unknown') if is_number(v) else none }}

  - binary_sensor:
      - name: "SmarterSpa generating"
        unique_id: smarterspa_generating
        icon: mdi:lightning-bolt
        state: "{{ (states('sensor.spa_smarterspa_state_raw') | float(0) | round(0) | int) in [2, 3, 4] }}"
      - name: "SmarterSpa salt low"
        unique_id: smarterspa_salt_low
        device_class: problem
        state: "{{ (states('sensor.spa_smarterspa_state_raw') | float(0) | round(0) | int) == 3 }}"
      - name: "SmarterSpa salt high"
        unique_id: smarterspa_salt_high
        device_class: problem
        state: "{{ (states('sensor.spa_smarterspa_state_raw') | float(0) | round(0) | int) == 4 }}"
      - name: "SmarterSpa salt shutdown"
        unique_id: smarterspa_salt_shutdown
        device_class: problem
        state: "{{ (states('sensor.spa_smarterspa_state_raw') | float(0) | round(0) | int) == 5 }}"
      - name: "SmarterSpa fault"
        unique_id: smarterspa_fault
        device_class: problem
        state: "{{ (states('sensor.spa_smarterspa_state_raw') | float(0) | round(0) | int) == 6 }}"

  # Graph-friendly readings: one value per pump run, taken when the run ends
  # (readings live -> off), i.e. after the longest settling. Between runs the
  # value holds the last real measurement, so graphs show no pump-off flatline
  # of stale data or the pipe cooling (the temperature probe is in the plumbing).
  # Runs under 5 min (never live) record nothing.
  - triggers:
      - trigger: state
        entity_id: binary_sensor.spa_readings_live
        from: "on"
        to: "off"
    sensor:
      - name: "Spa pH per run"
        unique_id: spa_ph_per_run
        device_class: ph
        state_class: measurement
        icon: mdi:ph
        state: >-
          {% set v = states('sensor.spa_ph') %}
          {{ v if is_number(v) else this.state }}
      - name: "Spa ORP per run"
        unique_id: spa_orp_per_run
        unit_of_measurement: mV
        device_class: voltage
        state_class: measurement
        icon: mdi:flash-triangle-outline
        state: >-
          {% set v = states('sensor.spa_orp') %}
          {{ v if is_number(v) else this.state }}
      - name: "Spa water temperature per run"
        unique_id: spa_water_temperature_per_run
        device_class: temperature
        state_class: measurement
        unit_of_measurement: "°F"
        state: >-
          {% set v = states('sensor.spa_water_temperature') %}
          {{ v if is_number(v) else this.state }}

  # Timeline marker for the dashboard's Log buttons: the most recent action for
  # 30 min after its press, otherwise nothing (now() re-renders this each minute).
  - sensor:
      - name: "Spa chemistry log"
        unique_id: spa_chemistry_log
        icon: mdi:flask-outline
        state: >-
          {% set items = [('pH down', 'input_button.spa_log_ph_down'),
                          ('Salt', 'input_button.spa_log_salt'),
                          ('Boost', 'input_button.spa_log_boost'),
                          ('Strip test', 'input_button.spa_log_strip_test')] %}
          {% set ns = namespace(name=none, t=now() - timedelta(minutes=30)) %}
          {% for label, e in items %}
            {% set t = as_datetime(states(e), none) %}
            {% if t is not none and t > ns.t %}{% set ns.name = label %}{% set ns.t = t %}{% endif %}
          {% endfor %}
          {{ ns.name }}

sensor:
  - platform: history_stats
    name: "SmarterSpa generating 24h"   # name sets the id: sensor.smarterspa_generating_24h
    unique_id: smarterspa_generating_24h
    entity_id: binary_sensor.smarterspa_generating
    state: "on"
    type: time
    start: "{{ now() - timedelta(hours=24) }}"
    end: "{{ now() }}"
  - platform: history_stats
    name: "Spa pump runtime 24h"   # name sets the id: sensor.spa_pump_runtime_24h
    unique_id: spa_pump_runtime_24h
    entity_id: binary_sensor.spa_pump_running
    state: "on"
    type: time
    start: "{{ now() - timedelta(hours=24) }}"
    end: "{{ now() }}"

script:
  spa_new_electrode:
    alias: "Spa: new electrode installed"
    icon: mdi:autorenew
    description: >-
      Start this electrode's hours at 0. Also reset the SmarterSpa's own counter:
      press all three buttons on its control box at once.
    sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.spa_electrode_monitor_count_at_install
        data:
          value: "{{ (states('sensor.spa_electrode_hours_raw') | float(0) * 100) | round(0) | int }}"
      - action: input_number.set_value
        target:
          entity_id: input_number.spa_electrode_hours_at_install
        data:
          value: 0
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.spa_electrode_installed
        data:
          date: "{{ now().date() }}"

automation:
  - id: spa_seed_thresholds
    alias: "Spa: seed threshold helpers on first install"
    triggers:
      - trigger: homeassistant
        event: start
    actions:
      - repeat:
          for_each:
            - { entity: input_number.spa_orp_low_mv, min: 300, value: 650 }
            - { entity: input_number.spa_orp_high_mv, min: 400, value: 800 }
            - { entity: input_number.spa_ph_low, min: 6.0, value: 7.2 }
            - { entity: input_number.spa_ph_high, min: 6.5, value: 7.8 }
            - { entity: input_number.spa_ph_offset, min: -6.0, value: 0 }
            - { entity: input_number.spa_orp_offset, min: -1000, value: 0 }
          sequence:
            - if:
                - condition: template
                  value_template: "{{ states(repeat.item.entity) | float(0) == repeat.item.min }}"
              then:
                - action: input_number.set_value
                  target:
                    entity_id: "{{ repeat.item.entity }}"
                  data:
                    value: "{{ repeat.item.value }}"

  # The firmware publishes "Calibrating..." then the result on every press, so
  # the status always changes; stamp the date only when the result is OK.
  - id: spa_stamp_ph_calibration
    alias: "Spa: record pH calibration date"
    mode: restart
    triggers:
      - trigger: state
        entity_id: [switch.spa_calibrate_ph_7, switch.spa_calibrate_ph_4, switch.spa_calibrate_ph_10]
        to: "on"
    actions:
      - wait_for_trigger:
          - trigger: state
            entity_id: sensor.spa_calibration_status
            to: "OK"
        timeout: "00:01:00"
        continue_on_timeout: false
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.spa_last_ph_calibration
        data:
          timestamp: "{{ now().timestamp() }}"

  - id: spa_stamp_orp_calibration
    alias: "Spa: record ORP calibration date"
    mode: restart
    triggers:
      - trigger: state
        entity_id: switch.spa_calibrate_orp
        to: "on"
    actions:
      - wait_for_trigger:
          - trigger: state
            entity_id: sensor.spa_calibration_status
            to: "OK"
        timeout: "00:01:00"
        continue_on_timeout: false
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.spa_last_orp_calibration
        data:
          timestamp: "{{ now().timestamp() }}"

  # Alerts (PLAN.md Phase 6). Persistent notifications in HA; add a phone
  # notify action here once one is set up.
  - id: spa_alert_salt_shutdown
    alias: "Spa alert: SmarterSpa shut down (salt over max)"
    triggers:
      - trigger: state
        entity_id: binary_sensor.smarterspa_salt_shutdown
        to: "on"
        for: "00:05:00"
    actions:
      - action: persistent_notification.create
        data:
          notification_id: spa_salt_shutdown
          title: "Spa: chlorinator shut down"
          message: "SmarterSpa shows red + yellow: salt over maximum. It has stopped generating chlorine."

  - id: spa_alert_fault
    alias: "Spa alert: SmarterSpa fault / no power"
    triggers:
      - trigger: state
        entity_id: binary_sensor.smarterspa_fault
        to: "on"
        for: "00:10:00"
    actions:
      - action: persistent_notification.create
        data:
          notification_id: spa_fault
          title: "Spa: chlorinator has no power"
          message: "No SmarterSpa lights or standby blink for 10 minutes: check its power / GFCI."

  - id: spa_alert_salt_low
    alias: "Spa alert: salt low"
    triggers:
      - trigger: state
        entity_id: binary_sensor.smarterspa_salt_low
        to: "on"
        for: "00:30:00"
    actions:
      - action: persistent_notification.create
        data:
          notification_id: spa_salt_low
          title: "Spa: salt low"
          message: "SmarterSpa is generating with the red (salt low) light. Add salt."

  - id: spa_alert_ph
    alias: "Spa alert: pH out of range"
    triggers:
      - trigger: numeric_state
        entity_id: sensor.spa_ph
        below: input_number.spa_ph_low
        for: "00:30:00"
      - trigger: numeric_state
        entity_id: sensor.spa_ph
        above: input_number.spa_ph_high
        for: "00:30:00"
    conditions:
      - condition: state
        entity_id: binary_sensor.spa_readings_live
        state: "on"
    actions:
      - action: persistent_notification.create
        data:
          notification_id: spa_ph
          title: "Spa: pH {{ states('sensor.spa_ph') }}"
          message: >-
            pH has been outside {{ states('input_number.spa_ph_low') }}-{{ states('input_number.spa_ph_high') }}
            for 30 minutes while the pump was running.

  - id: spa_alert_chlorine_low
    alias: "Spa alert: chlorine low"
    triggers:
      - trigger: state
        entity_id: sensor.spa_chlorine
        to: "Low"
        for: "01:00:00"
    conditions:
      - condition: state
        entity_id: binary_sensor.spa_readings_live
        state: "on"
    actions:
      - action: persistent_notification.create
        data:
          notification_id: spa_chlorine_low
          title: "Spa: chlorine low"
          message: "ORP {{ states('sensor.spa_orp') }} mV has read Low for an hour of pump running."
