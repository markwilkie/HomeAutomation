# MiniSplit Follow-Me band control (permanent since 2026-11-20; trialled
# that day as the "Follow-Me experiment" -- entity IDs keep that name so
# their history carries on).
#
# Why: in Heat the unit only ever sees whole degrees C over IR (state[11]),
# and it behaves like a fixed thermostat around its setpoint: Follow-Me at
# setpoint-1C = heat, setpoint = keep doing whatever it's doing, setpoint+1C
# = stop. That 2C (3.6F) deadband plus the bridge's 3-minute heartbeat gave
# a ~4F room swing every cycle (2026-11-18/19: on at ~68.7F, off at
# ~72.0-72.5F, peak ~72.7-73.0F, ~1 cycle/hour).
#
# What: while binary_sensor.minisplit_follow_me_band_active is on
# (input_select.minisplit_followme_experiment = band, unit in Heat, sensors
# available), HA doesn't relay the real room
# temperature to the bridge's Follow-Me endpoint (thermostat_10); it sends
# a chosen whole C so HA decides when the unit heats and stops:
#   heat at <= target-0.3F, stop at >= target+0.5F, else hold
# (target = sensor.minisplit_follow_me_band_target: the schedule's
# sensor.minisplit_computed_setpoint, so the day/night ramps carry over, or
# during a manual override the setpoint the override chose -- owner's call
# 2026-11-21, band keeps running through overrides). heat/stop/hold = setpoint-1C (floor), setpoint+1C (ceil),
# setpoint (rounded): 19/22/21 at the 20.5C (69F) setpoint.
# Latch (2026-11-20): once heat is sent it's kept until the compressor
# starts, and stop until it stops -- the sensor's 0.18F steps straddle the
# lines and used to flip heat/hold several times a minute, delaying starts
# 5-7 min.
# Guards: stop is held back as hold until the compressor has run
# input_number.minisplit_followme_min_run_min (6-10 min, adaptive -- see
# below); heat as hold until it has been off 10 min. If the unit ignores
# stop for 6 min, stop goes one degree C higher. Heat never steps lower
# (2026-11-21): a new value takes 3-6 min to show up at the unit (the bridge
# sends Follow-Me with its poll), so "ignored for 6 min" was mostly that lag,
# and the extra degree looked to make the unit start at full output
# (64.4 -> 68.0F in 7 min on the 2026-11-21 06:13 start).
# Already running (2026-11-23): heat isn't re-sent to a running compressor
# (a target ramp step used to re-send it) unless the room is 1.5F+ under
# target -- hold lets the unit ease off instead of pushing harder.
# Early stop (2026-11-23): rising 0.3F/min+ (sensor.minisplit_room_rate)
# with the room at target and projected past the stop line within 3 min,
# stop is sent early, and the minimum run counts 3 min less because the
# unit only acts on it ~3.5 min later. Before: the 06:13 start overshot
# to 67.5F against a 65.5F target (stop line passed 06:17:48, unit off
# 06:23:12).
# Start budget (owner's limit): at most 3 compressor starts in any rolling
# 60 minutes. Once the last 3 starts all fall within the past hour, heat is
# held back as hold until the oldest of them is 60 min old. Pioneer
# documents only a 3-min restart delay (enforced by the unit itself); 3
# starts/hour is the usual HVAC rule of thumb. Starts are recorded in
# input_text.minisplit_compressor_starts whatever the mode.
# Adaptive minimum run: the budget holds the room off below the start line,
# which hurts most on cold days when the room cools fastest, so starts are
# kept in line by run length first and the budget is only the backstop. At
# each start while active, the gap since the previous start adjusts the
# minimum run by 1 min (bounds 6-10): under 24 min (heading above 2.5
# starts/hour) -> +1; 24-40 min -> unchanged; 40-90 min -> -1. Gaps of 90+
# min (an idle spell) are ignored. Driven by measured cycling, not outdoor
# temperature, so wind, sun, open doors and cold-weather capacity loss are
# all covered without calibration.
# Pauses (unit not in Heat, sensor gone): band_active goes
# off (2 min delay), the real reading is sent again and the normal relay
# ("MiniSplit FollowMe temp relay to firmware") takes over. Desired comes
# from "MiniSplit schedule setpoint" (the target, whole F) -- band's
# commands are relative to it.
# Safety stop (turns band off and notifies): room more than 4F above target,
# or more than 4F below it with the compressor off for 30+ min.
# Not built for Cool yet -- see history/followme-experiment-2026-11-20.md.
#
# Results / log: history/followme-experiment-2026-11-20.md
# (2026-11-20: ~4F -> ~2.2F swing, ~1.7 starts/hour, 9-10 min runs).

input_select:
  # Owner's on/off switch for band control (no initial: restores).
  minisplit_followme_experiment:
    name: "MiniSplit Follow-Me Band Control"
    options:
      - "off"
      - "band"
    icon: mdi:thermostat-auto

input_number:
  # Whole C last sent (its history is the control's log).
  minisplit_followme_sent_c:
    name: "MiniSplit Follow-Me Band Sent"
    min: 15
    max: 30
    step: 1
    unit_of_measurement: "°C"
    mode: box
    icon: mdi:thermometer-lines
  # Adaptive minimum compressor run while active (see above).
  minisplit_followme_min_run_min:
    name: "MiniSplit Follow-Me Band Min Run"
    min: 6
    max: 10
    step: 1
    unit_of_measurement: "min"
    mode: box
    icon: mdi:timer-cog

input_text:
  # Unix times of the most recent compressor starts, newest first,
  # comma-separated (kept to 6). Feeds the start budget above.
  minisplit_compressor_starts:
    name: "MiniSplit Compressor Starts (log)"
    max: 100
    icon: mdi:counter

# How fast the room is moving right now (F/min over the last 3 min) -- the
# 1 h sensor.minisplit_room_trend is far too slow to catch a start blowing
# hot air. Feeds the early stop below. Only updates when the reading
# changes, so the automation ignores it once it's 3+ min old.
sensor:
  - platform: derivative
    source: sensor.0x18690afffe5602f1_temperature
    name: "MiniSplit Room Rate"
    unique_id: minisplit_room_rate
    unit_time: min
    time_window: "00:03:00"
    round: 2

template:
  - sensor:
      - name: "MiniSplit Compressor Starts Last Hour"
        unique_id: minisplit_compressor_starts_last_hour
        icon: mdi:counter
        state_class: measurement
        state: >-
          {% set raw = states('input_text.minisplit_compressor_starts') %}
          {% set ts = raw.split(',') | reject('eq', '') | map('int', 0) | list if raw not in ['unknown', 'unavailable'] else [] %}
          {{ ts | select('gt', now().timestamp() - 3600) | list | count }}
      # The sent value in F, for the dashboard (whole C, so 66.2/69.8/71.6...).
      - name: "MiniSplit Follow-Me Band Sent F"
        unique_id: minisplit_followme_band_sent_f
        icon: mdi:thermometer-lines
        unit_of_measurement: "°F"
        device_class: temperature
        state_class: measurement
        state: >-
          {% set c = states('input_number.minisplit_followme_sent_c') %}
          {{ ((c | float * 1.8) + 32) | round(1) if is_number(c) else none }}
      # What band control holds the room at: the schedule, or a manual
      # override's own setpoint while one is on.
      - name: "MiniSplit Follow-Me Band Target"
        unique_id: minisplit_followme_band_target
        icon: mdi:target
        unit_of_measurement: "°F"
        device_class: temperature
        state: >-
          {% set ov = state_attr('climate.bedroom_mini_split_ac_bridge_thermostat_6', 'temperature') %}
          {% if is_state('binary_sensor.minisplit_manual_override', 'on') and ov is not none %}{{ ov | float }}
          {% elif has_value('sensor.minisplit_computed_setpoint') %}{{ states('sensor.minisplit_computed_setpoint') | float }}
          {% else %}{{ none }}{% endif %}
  - binary_sensor:
      # On while band control is sending the Follow-Me value. delay_off rides
      # out a brief Matter/Zigbee blip instead of handing back and forth.
      - name: "MiniSplit Follow-Me Band Active"
        unique_id: minisplit_followme_band_active
        icon: mdi:thermostat-auto
        delay_off: "00:02:00"
        state: >-
          {{ is_state('input_select.minisplit_followme_experiment', 'band')
             and is_state('climate.bedroom_mini_split_ac_bridge_thermostat_6', 'heat')
             and has_value('sensor.0x18690afffe5602f1_temperature')
             and has_value('sensor.minisplit_follow_me_band_target')
             and state_attr('climate.bedroom_mini_split_ac_bridge_thermostat_6', 'temperature') is not none }}

automation:
  - id: minisplit_compressor_start_log
    alias: MiniSplit compressor start log
    description: >-
      Records each compressor start in input_text.minisplit_compressor_starts
      for the start budget, and adapts the minimum run while band control is
      active (packages/minisplit_followme_band.yaml).
    triggers:
      - trigger: state
        entity_id: binary_sensor.bedroom_mini_split_ac_bridge_occupancy_4
        from: "off"
        to: "on"
    actions:
      - variables:
          # Read inside the template (a "a,b,c" variable becomes a tuple).
          prev_start: >-
            {% set prev_raw = states('input_text.minisplit_compressor_starts') %}
            {% set ts = prev_raw.split(',') | reject('eq', '') | map('int', 0) | list if prev_raw not in ['unknown', 'unavailable'] else [] %}
            {{ ts[0] if ts | count > 0 else 0 }}
          gap_min: "{{ ((now().timestamp() - prev_start) / 60) | round(1) }}"
          cur_run: "{{ states('input_number.minisplit_followme_min_run_min') | int(6) }}"
          new_run: >-
            {% if gap_min < 24 %}{{ [cur_run + 1, 10] | min }}
            {% elif 40 < gap_min < 90 %}{{ [cur_run - 1, 6] | max }}
            {% else %}{{ cur_run }}{% endif %}
      - if:
          - condition: template
            value_template: >-
              {{ is_state('binary_sensor.minisplit_follow_me_band_active', 'on')
                 and prev_start > 0 and new_run | int != cur_run }}
        then:
          - action: input_number.set_value
            target:
              entity_id: input_number.minisplit_followme_min_run_min
            data:
              value: "{{ new_run | int }}"
          - action: logbook.log
            data:
              name: "Follow-Me band"
              message: "minimum run {{ cur_run }} -> {{ new_run | int }} min ({{ gap_min }} min since the previous start)"
              entity_id: input_number.minisplit_followme_min_run_min
      - action: input_text.set_value
        target:
          entity_id: input_text.minisplit_compressor_starts
        data:
          value: >-
            {% set raw = states('input_text.minisplit_compressor_starts') %}
            {% set ts = raw.split(',') | reject('eq', '') | list if raw not in ['unknown', 'unavailable'] else [] %}
            {{ ([now().timestamp() | int | string] + ts)[:6] | join(',') }}
    mode: queued

  - id: minisplit_followme_experiment_control
    alias: MiniSplit Follow-Me band control
    description: >-
      Sends band control's chosen Follow-Me value to thermostat_10 while
      binary_sensor.minisplit_follow_me_band_active is on. See
      packages/minisplit_followme_band.yaml.
    triggers:
      - trigger: state
        entity_id: sensor.0x18690afffe5602f1_temperature
      - trigger: state
        entity_id: binary_sensor.bedroom_mini_split_ac_bridge_occupancy_4
      - trigger: state
        entity_id: binary_sensor.minisplit_follow_me_band_active
        to: "on"
      - trigger: time_pattern
        minutes: /1
    conditions:
      - condition: state
        entity_id: binary_sensor.minisplit_follow_me_band_active
        state: "on"
      - condition: template
        value_template: >-
          {{ has_value('sensor.0x18690afffe5602f1_temperature') and has_value('sensor.minisplit_follow_me_band_target')
             and states('binary_sensor.bedroom_mini_split_ac_bridge_occupancy_4') in ['on', 'off'] }}
    actions:
      - variables:
          room: "{{ states('sensor.0x18690afffe5602f1_temperature') | float }}"
          target: "{{ states('sensor.minisplit_follow_me_band_target') | float }}"
          comp_on: "{{ is_state('binary_sensor.bedroom_mini_split_ac_bridge_occupancy_4', 'on') }}"
          comp_age_min: >-
            {{ ((now() - states.binary_sensor.bedroom_mini_split_ac_bridge_occupancy_4.last_changed).total_seconds() / 60) | round(1) }}
          prev_c: "{{ states('input_number.minisplit_followme_sent_c') | int(21) }}"
          prev_age_min: >-
            {{ ((now() - states.input_number.minisplit_followme_sent_c.last_changed).total_seconds() / 60) | round(1) }}
          rate: >-
            {{ states('sensor.minisplit_room_rate') | float(0)
               if has_value('sensor.minisplit_room_rate')
                  and (now() - states.sensor.minisplit_room_rate.last_updated).total_seconds() < 180
               else 0 }}
          # Early stop: rising 0.3F/min+ with the room already at target -- a
          # stop takes ~3.5 min to land, so stop when it's projected to pass
          # the stop line within 3 min (2026-11-23 06:13: 64.6 -> 67.5F).
          fast_rise: "{{ comp_on and rate >= 0.3 and room >= target and room + rate * 3 >= target + 0.5 }}"
          raw_wanted: >-
            {{ 'heat' if room <= target - 0.3 else ('stop' if room >= target + 0.5 or fast_rise else 'hold') }}
          # The unit's own band is its setpoint +/- 1C (found 2026-11-20: at a
          # 21C setpoint 20 starts it, at 20.5C it needs 19), so the commands
          # are relative to the setpoint it holds (Desired, 0.5C steps).
          sp_c: "{{ (((state_attr('climate.bedroom_mini_split_ac_bridge_thermostat_6', 'temperature') | float(69)) - 32) / 1.8 * 2) | round(0) / 2 }}"
          heat_c: "{{ (sp_c - 1) | round(0, 'floor') | int }}"
          stop_c: "{{ (sp_c + 1) | round(0, 'ceil') | int }}"
          hold_c: "{{ (sp_c + 0.01) | round(0) | int }}"
          # Latch: keep heat until the compressor starts, stop until it stops.
          wanted: >-
            {% if prev_c <= heat_c and not comp_on and raw_wanted != 'stop' %}heat
            {% elif prev_c >= stop_c and comp_on and raw_wanted != 'heat' %}stop
            {% else %}{{ raw_wanted }}{% endif %}
          # Start budget: 3rd most recent start, or 0 if fewer than 3 logged.
          # Read the list inside the template: as its own variable, HA's native
          # typing turns "a,b,c" into a tuple and .split() fails.
          third_start: >-
            {% set starts_raw = states('input_text.minisplit_compressor_starts') %}
            {% set ts = starts_raw.split(',') | reject('eq', '') | map('int', 0) | list if starts_raw not in ['unknown', 'unavailable'] else [] %}
            {{ ts[2] if ts | count >= 3 else 0 }}
          budget_ok: "{{ now().timestamp() - third_start >= 3600 }}"
          budget_free_in_min: "{{ ((third_start + 3600 - now().timestamp()) / 60) | round(0) | int }}"
          desired_c: >-
            {% if wanted == 'stop' %}
              {% if comp_on and comp_age_min < states('input_number.minisplit_followme_min_run_min') | int(6) - (3 if fast_rise else 0) %}{{ hold_c }}
              {% elif comp_on and prev_c >= stop_c and prev_age_min >= 6 %}{{ stop_c + 1 }}
              {% elif prev_c == stop_c + 1 %}{{ stop_c + 1 }}
              {% else %}{{ stop_c }}{% endif %}
            {% elif wanted == 'heat' %}
              {% if comp_on and room > target - 1.5 %}{{ hold_c }}
              {% elif not comp_on and comp_age_min < 10 %}{{ hold_c }}
              {% elif not comp_on and not budget_ok %}{{ hold_c }}
              {% else %}{{ heat_c }}{% endif %}
            {% else %}{{ hold_c }}{% endif %}
          desired_f: "{{ (desired_c | int * 1.8 + 32) | round(1) }}"
          relayed_f: "{{ state_attr('climate.bedroom_mini_split_ac_bridge_thermostat_10', 'temperature') | float(0) }}"
      - if:
          - condition: template
            value_template: "{{ desired_c | int != prev_c }}"
        then:
          - action: input_number.set_value
            target:
              entity_id: input_number.minisplit_followme_sent_c
            data:
              value: "{{ desired_c | int }}"
          - action: logbook.log
            data:
              name: "Follow-Me band"
              message: >-
                sent {{ desired_c | int }}C (room {{ room }}F, target {{ target }}F,
                wanted {{ wanted }}, compressor {{ 'on' if comp_on else 'off' }} {{ comp_age_min }} min{{
                '' if budget_ok or comp_on or wanted != 'heat' else ', start budget used -- next start in ' ~ budget_free_in_min ~ ' min' }})
              entity_id: input_number.minisplit_followme_sent_c
      # Also resends when thermostat_10 doesn't hold the value (dropped write).
      - if:
          - condition: template
            value_template: "{{ (relayed_f - desired_f) | abs >= 0.5 }}"
        then:
          - action: climate.set_temperature
            target:
              entity_id: climate.bedroom_mini_split_ac_bridge_thermostat_10
            data:
              temperature: "{{ desired_f }}"
    mode: single
    max_exceeded: silent

  # Back to the real reading whenever band control stops sending (turned
  # off, mode change, override, sensor trouble). If the sensor itself is
  # gone, the last sent value stays -- same as the relay, which can't send
  # an unavailable reading either.
  - id: minisplit_followme_experiment_restore
    alias: MiniSplit Follow-Me band restore
    triggers:
      - trigger: state
        entity_id: binary_sensor.minisplit_follow_me_band_active
        from: "on"
        to: "off"
    conditions:
      - condition: template
        value_template: "{{ has_value('sensor.0x18690afffe5602f1_temperature') }}"
    actions:
      - action: climate.set_temperature
        target:
          entity_id: climate.bedroom_mini_split_ac_bridge_thermostat_10
        data:
          temperature: "{{ states('sensor.0x18690afffe5602f1_temperature') | float }}"
      - action: logbook.log
        data:
          name: "Follow-Me band"
          message: "paused -- relaying the real reading again ({{ states('sensor.0x18690afffe5602f1_temperature') }}F)"
          entity_id: input_number.minisplit_followme_sent_c
    mode: single

  - id: minisplit_followme_experiment_safety
    alias: MiniSplit Follow-Me band safety stop
    description: >-
      Turns band control off and notifies if the room is more than 4F above
      the target, or more than 4F below it with the compressor off 30+ min.
    triggers:
      - trigger: time_pattern
        minutes: /1
    conditions:
      - condition: state
        entity_id: binary_sensor.minisplit_follow_me_band_active
        state: "on"
      - condition: template
        value_template: >-
          {% set r = states('sensor.0x18690afffe5602f1_temperature') | float(0) %}
          {% set t = states('sensor.minisplit_follow_me_band_target') | float(0) %}
          {% set off_min = ((now() - states.binary_sensor.bedroom_mini_split_ac_bridge_occupancy_4.last_changed).total_seconds() / 60) %}
          {{ has_value('sensor.0x18690afffe5602f1_temperature') and has_value('sensor.minisplit_follow_me_band_target')
             and (r > t + 4
                  or (r < t - 4 and is_state('binary_sensor.bedroom_mini_split_ac_bridge_occupancy_4', 'off') and off_min >= 30)) }}
    actions:
      - action: input_select.select_option
        target:
          entity_id: input_select.minisplit_followme_experiment
        data:
          option: "off"
      - action: persistent_notification.create
        data:
          title: "Follow-Me band control stopped"
          message: >-
            Safety stop at {{ now().strftime('%H:%M') }}: room {{ states('sensor.0x18690afffe5602f1_temperature') }}F,
            target {{ states('sensor.minisplit_follow_me_band_target') }}F, compressor
            {{ states('binary_sensor.bedroom_mini_split_ac_bridge_occupancy_4') }}. Back on the normal relay;
            turn MiniSplit Follow-Me Band Control back to band once it's sorted.
    mode: single
