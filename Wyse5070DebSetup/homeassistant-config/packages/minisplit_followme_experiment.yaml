# MiniSplit Follow-Me spoofing experiment (2026-11-20).
#
# Why: in Heat the unit only ever sees whole degrees C over IR (state[11]),
# and around its ~20.5C setpoint it behaves like a fixed thermostat --
# Follow-Me 20 = heat, 21 = keep doing whatever it's doing, 22 = stop. That
# 2C (3.6F) deadband plus the bridge's 3-minute heartbeat is the ~4F
# room swing seen every daytime cycle (2026-11-18/19: on at ~68.7F, off at
# ~72.0-72.5F, peak ~72.7-73.0F, ~1 cycle/hour).
#
# What: while input_select.minisplit_followme_experiment isn't "off", HA
# stops relaying the real room temperature to the bridge's Follow-Me
# endpoint (thermostat_10) and instead sends a chosen whole C so HA decides
# when the unit heats and stops, inside a band it picks:
#   band       heat at <= target-0.3F, stop at >= target+0.5F, else hold
#   soft_hold  heat at <= target-0.3F, stop at >= target+1.5F, else hold (tests
#              whether the inverter throttles down while it holds)
# heat/stop/hold = setpoint-1C (floor), setpoint+1C (ceil), setpoint (rounded):
# 19/22/21 at the 20.5C (69F) setpoint, 20/22/21 at 21C (70F).
# Guards: stop is held back as hold until the compressor has run 6 min (8
# until 12:10 on 2026-11-20 -- see the history file);
# heat as hold until it has been off 10 min. If the unit ignores heat or
# stop for 6 min, it escalates one more degree C.
# Start budget (2026-11-20, owner's limit): at most 3 compressor starts in
# any rolling 60 minutes. Once the last 3 starts all fall within the past
# hour, heat is held back as hold until the oldest of them is 60 min old.
# Pioneer documents only a 3-min restart delay (enforced by the unit
# itself); 3 starts/hour is the usual HVAC rule of thumb. Starts are
# recorded in input_text.minisplit_compressor_starts whether or not an arm
# is active, so the budget is right from the first tick of a run.
# While an arm is active, the normal relay ("MiniSplit FollowMe temp relay
# to firmware") and the setpoint automation stand down -- the spoofed value
# can trip binary_sensor.minisplit_followme_engaged, which would make the
# setpoint automation fall back to its predictive controller mid-experiment.
#
# Results / log: history/followme-experiment-2026-11-20.md.

input_select:
  minisplit_followme_experiment:
    name: "MiniSplit Follow-Me Experiment"
    options:
      - "off"
      - "band"
      - "soft_hold"
    icon: mdi:flask

input_number:
  # Whole C the experiment last sent (its history is the experiment's log).
  minisplit_followme_sent_c:
    name: "MiniSplit Follow-Me Experiment Sent"
    min: 15
    max: 30
    step: 1
    unit_of_measurement: "°C"
    mode: box
    icon: mdi:thermometer-lines

input_text:
  # Unix times of the most recent compressor starts, newest first,
  # comma-separated (kept to 6). Feeds the start budget above.
  minisplit_compressor_starts:
    name: "MiniSplit Compressor Starts (log)"
    max: 100
    icon: mdi:counter

template:
  - sensor:
      - name: "MiniSplit Compressor Starts Last Hour"
        unique_id: minisplit_compressor_starts_last_hour
        icon: mdi:counter
        state_class: measurement
        state: >-
          {% set raw = states('input_text.minisplit_compressor_starts') %}
          {% set ts = raw.split(',') | reject('eq', '') | map('int', 0) | list if raw not in ['unknown', 'unavailable'] else [] %}
          {{ ts | select('gt', now().timestamp() - 3600) | list | count }}

automation:
  - id: minisplit_compressor_start_log
    alias: MiniSplit compressor start log
    description: >-
      Records each compressor start in input_text.minisplit_compressor_starts
      for the start budget (packages/minisplit_followme_experiment.yaml).
    triggers:
      - trigger: state
        entity_id: binary_sensor.bedroom_mini_split_ac_bridge_occupancy_4
        from: "off"
        to: "on"
    actions:
      - action: input_text.set_value
        target:
          entity_id: input_text.minisplit_compressor_starts
        data:
          value: >-
            {% set raw = states('input_text.minisplit_compressor_starts') %}
            {% set ts = raw.split(',') | reject('eq', '') | list if raw not in ['unknown', 'unavailable'] else [] %}
            {{ ([now().timestamp() | int | string] + ts)[:6] | join(',') }}
    mode: queued

  - id: minisplit_followme_experiment_control
    alias: MiniSplit Follow-Me experiment control
    description: >-
      Sends the experiment's chosen Follow-Me value to thermostat_10 while
      input_select.minisplit_followme_experiment is band or soft_hold. See
      packages/minisplit_followme_experiment.yaml.
    triggers:
      - trigger: state
        entity_id: sensor.0x18690afffe5602f1_temperature
      - trigger: state
        entity_id: binary_sensor.bedroom_mini_split_ac_bridge_occupancy_4
      - trigger: state
        entity_id: input_select.minisplit_followme_experiment
      - trigger: time_pattern
        minutes: /1
    conditions:
      - condition: template
        value_template: "{{ states('input_select.minisplit_followme_experiment') in ['band', 'soft_hold'] }}"
      - condition: template
        value_template: "{{ has_value('sensor.0x18690afffe5602f1_temperature') and has_value('sensor.minisplit_computed_setpoint') }}"
    actions:
      - variables:
          arm: "{{ states('input_select.minisplit_followme_experiment') }}"
          room: "{{ states('sensor.0x18690afffe5602f1_temperature') | float }}"
          target: "{{ states('sensor.minisplit_computed_setpoint') | float }}"
          comp_on: "{{ is_state('binary_sensor.bedroom_mini_split_ac_bridge_occupancy_4', 'on') }}"
          comp_age_min: >-
            {{ ((now() - states.binary_sensor.bedroom_mini_split_ac_bridge_occupancy_4.last_changed).total_seconds() / 60) | round(1) }}
          prev_c: "{{ states('input_number.minisplit_followme_sent_c') | int(21) }}"
          prev_age_min: >-
            {{ ((now() - states.input_number.minisplit_followme_sent_c.last_changed).total_seconds() / 60) | round(1) }}
          off_at: "{{ target + (0.5 if arm == 'band' else 1.5) }}"
          wanted: >-
            {{ 'heat' if room <= target - 0.3 else ('stop' if room >= off_at else 'hold') }}
          # The unit's own band is its setpoint +/- 1C (found 2026-11-20: at a
          # 21C setpoint 20 starts it, at 20.5C it needs 19), so the commands
          # are relative to the setpoint it holds (Desired, 0.5C steps).
          sp_c: "{{ (((state_attr('climate.bedroom_mini_split_ac_bridge_thermostat_6', 'temperature') | float(69)) - 32) / 1.8 * 2) | round(0) / 2 }}"
          heat_c: "{{ (sp_c - 1) | round(0, 'floor') | int }}"
          stop_c: "{{ (sp_c + 1) | round(0, 'ceil') | int }}"
          hold_c: "{{ (sp_c + 0.01) | round(0) | int }}"
          # Start budget: 3rd most recent start, or 0 if fewer than 3 logged.
          starts_raw: "{{ states('input_text.minisplit_compressor_starts') }}"
          third_start: >-
            {% set ts = starts_raw.split(',') | reject('eq', '') | map('int', 0) | list if starts_raw not in ['unknown', 'unavailable'] else [] %}
            {{ ts[2] if ts | count >= 3 else 0 }}
          budget_ok: "{{ now().timestamp() - third_start >= 3600 }}"
          budget_free_in_min: "{{ ((third_start + 3600 - now().timestamp()) / 60) | round(0) | int }}"
          desired_c: >-
            {% if wanted == 'stop' %}
              {% if comp_on and comp_age_min < 6 %}{{ hold_c }}
              {% elif comp_on and prev_c >= stop_c and prev_age_min >= 6 %}{{ stop_c + 1 }}
              {% elif prev_c == stop_c + 1 %}{{ stop_c + 1 }}
              {% else %}{{ stop_c }}{% endif %}
            {% elif wanted == 'heat' %}
              {% if not comp_on and comp_age_min < 10 %}{{ hold_c }}
              {% elif not comp_on and not budget_ok %}{{ hold_c }}
              {% elif not comp_on and prev_c <= heat_c and prev_age_min >= 6 %}{{ heat_c - 1 }}
              {% elif prev_c == heat_c - 1 %}{{ heat_c - 1 }}
              {% else %}{{ heat_c }}{% endif %}
            {% else %}{{ hold_c }}{% endif %}
          desired_f: "{{ (desired_c | int * 1.8 + 32) | round(1) }}"
          relayed_f: "{{ state_attr('climate.bedroom_mini_split_ac_bridge_thermostat_10', 'temperature') | float(0) }}"
      - if:
          - condition: template
            value_template: "{{ desired_c | int != prev_c }}"
        then:
          - action: input_number.set_value
            target:
              entity_id: input_number.minisplit_followme_sent_c
            data:
              value: "{{ desired_c | int }}"
          - action: logbook.log
            data:
              name: "Follow-Me experiment"
              message: >-
                {{ arm }}: sent {{ desired_c | int }}C (room {{ room }}F, target {{ target }}F,
                wanted {{ wanted }}, compressor {{ 'on' if comp_on else 'off' }} {{ comp_age_min }} min{{
                '' if budget_ok or comp_on or wanted != 'heat' else ', start budget used -- next start in ' ~ budget_free_in_min ~ ' min' }})
              entity_id: input_number.minisplit_followme_sent_c
      # Also resends when thermostat_10 doesn't hold the value (dropped write).
      - if:
          - condition: template
            value_template: "{{ (relayed_f - desired_f) | abs >= 0.5 }}"
        then:
          - action: climate.set_temperature
            target:
              entity_id: climate.bedroom_mini_split_ac_bridge_thermostat_10
            data:
              temperature: "{{ desired_f }}"
    mode: single
    max_exceeded: silent

  # Back to the real reading the moment the experiment ends, however it ends.
  - id: minisplit_followme_experiment_restore
    alias: MiniSplit Follow-Me experiment restore
    triggers:
      - trigger: state
        entity_id: input_select.minisplit_followme_experiment
        to: "off"
    conditions:
      - condition: template
        value_template: "{{ has_value('sensor.0x18690afffe5602f1_temperature') }}"
    actions:
      - action: climate.set_temperature
        target:
          entity_id: climate.bedroom_mini_split_ac_bridge_thermostat_10
        data:
          temperature: "{{ states('sensor.0x18690afffe5602f1_temperature') | float }}"
      - action: logbook.log
        data:
          name: "Follow-Me experiment"
          message: "ended -- relaying the real reading again ({{ states('sensor.0x18690afffe5602f1_temperature') }}F)"
          entity_id: input_number.minisplit_followme_sent_c
    mode: single

  - id: minisplit_followme_experiment_safety
    alias: MiniSplit Follow-Me experiment safety stop
    description: >-
      Ends the experiment if the room is more than 4F from the target, the Zigbee sensor is
      gone for 10 min, the unit leaves Heat, or a manual override starts.
    triggers:
      - trigger: time_pattern
        minutes: /1
      - trigger: state
        entity_id: sensor.0x18690afffe5602f1_temperature
        to: ["unavailable", "unknown"]
        for: "00:10:00"
      - trigger: state
        entity_id: binary_sensor.minisplit_manual_override
        to: "on"
    conditions:
      - condition: template
        value_template: "{{ states('input_select.minisplit_followme_experiment') in ['band', 'soft_hold'] }}"
      - condition: template
        value_template: >-
          {% set r = states('sensor.0x18690afffe5602f1_temperature') %}
          {% set t = states('sensor.minisplit_computed_setpoint') | float(69) %}
          {{ (trigger.platform == 'state')
             or (has_value('sensor.0x18690afffe5602f1_temperature') and (r | float < t - 4 or r | float > t + 4))
             or states('climate.bedroom_mini_split_ac_bridge_thermostat_6') != 'heat'
             or is_state('binary_sensor.minisplit_manual_override', 'on') }}
    actions:
      - action: input_select.select_option
        target:
          entity_id: input_select.minisplit_followme_experiment
        data:
          option: "off"
      - action: persistent_notification.create
        data:
          title: "Follow-Me experiment stopped"
          message: >-
            Safety stop at {{ now().strftime('%H:%M') }}: room {{ states('sensor.0x18690afffe5602f1_temperature') }}F,
            mode {{ states('climate.bedroom_mini_split_ac_bridge_thermostat_6') }},
            override {{ states('binary_sensor.minisplit_manual_override') }}.
    mode: single

  # 2026-11-20 schedule: band 10:02-17:15, then real readings (end
  # baseline); 18:45 hard stop before the 19:00 night ramp. Date-gated so it
  # never fires on another day. The soft_hold slot (14:00) was dropped the
  # same day: band already sends hold during its 8-min minimum run and the
  # room rose at the baseline rate, so the inverter doesn't throttle on a
  # small gap -- and the owner doesn't want shorter-run tests stressing the
  # compressor, so band ran all day for a firmer number instead.
  - id: minisplit_followme_experiment_schedule
    alias: MiniSplit Follow-Me experiment schedule
    triggers:
      - trigger: time
        at: "17:15:00"
        id: "off"
      - trigger: time
        at: "18:45:00"
        id: "off"
    conditions:
      - condition: template
        value_template: "{{ now().strftime('%Y-%m-%d') == '2026-11-20' }}"
      - condition: template
        value_template: "{{ trigger.id == 'off' or is_state('input_select.minisplit_followme_experiment', 'band') }}"
    actions:
      - action: input_select.select_option
        target:
          entity_id: input_select.minisplit_followme_experiment
        data:
          option: "{{ trigger.id }}"
    mode: single
